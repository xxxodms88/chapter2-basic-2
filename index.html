<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C 백지 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 시험 답안지 — 상단 모드/장 선택, 왼쪽 문제 목록, 오른쪽 답안 작성 영역. 채점은 빨간펜 ○ / ✕ 표시 */
:root {
  --bg: #f3f5f8;
  --paper: #ffffff;
  --ink: #18212d;
  --muted: #5b6676;
  --rule: #d6dce5;
  --accent: #2747c9;
  --accent-soft: #e4e9fb;
  --pen: #d23b2c;
  --ok: #19804a;
  --ok-soft: #e2f3e8;
  --bad-soft: #fbe6e3;
  --part-soft: #fdf1d8;
  --part: #a8670a;
  --code-bg: #f7f8fb;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "D2Coding", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161e; --paper: #19202b; --ink: #e5e9f0; --muted: #98a3b3; --rule: #2d3747;
    --accent: #8ea4ff; --accent-soft: #232d4a; --pen: #ff7b6b; --ok: #5fd08f; --ok-soft: #173326;
    --bad-soft: #3a1f1c; --part-soft: #3a2e15; --part: #f0b450; --code-bg: #141a23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161e; --paper: #19202b; --ink: #e5e9f0; --muted: #98a3b3; --rule: #2d3747;
  --accent: #8ea4ff; --accent-soft: #232d4a; --pen: #ff7b6b; --ok: #5fd08f; --ok-soft: #173326;
  --bad-soft: #3a1f1c; --part-soft: #3a2e15; --part: #f0b450; --code-bg: #141a23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1280px; margin: 0 auto; }
header.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 12px; padding-block: 28px 18px; border-bottom: 2px solid var(--ink);
}
.brand h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 .mono { font-family: var(--font-mono); color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-size: 17px; display: block; line-height: 1.2; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 14px; }
.seg { display: inline-grid; grid-template-columns: repeat(7, auto); gap: 1px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--rule); }
@media (max-width: 860px) { .seg { display: flex; flex-wrap: wrap; width: 100%; } .seg button { flex: 1 1 auto; } }
@media (max-width: 400px) { .seg button { padding: 8px 6px; font-size: 13px; } }
.seg button { border: 0; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .mobile-pick { display: flex !important; } }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow: auto; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; }
.side .grp { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); padding: 10px 12px 4px; font-weight: 700; }
.side button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13.5px; padding: 6px 12px; cursor: pointer; }
.side button:hover { background: var(--accent-soft); }
.side button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.side .mark { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side .mark.done { color: var(--ok); }
.mobile-pick { display: none; gap: 8px; margin-bottom: 12px; }
.mobile-pick select { flex: 1; min-width: 0; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; min-width: 0; }
@media (max-width: 520px) { .sheet { padding: 16px; } }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 6px; }
.qhead h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.tag { font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; }
.desc { color: var(--muted); margin: 4px 0 14px; white-space: pre-wrap; }
.io { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
.io > div { min-width: 0; }
.label { font-size: 11px; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
pre, textarea.code, code, .blank { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
pre, textarea.code { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; tab-size: 4; }
pre.box { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
pre.term { background: var(--ink); color: var(--paper); border-color: var(--ink); }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.blank {
  font: inherit; font-size: 13px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft);
  color: var(--ink); padding: 0 3px; border-radius: 3px 3px 0 0; min-width: 3ch; text-align: center;
}
.blank.multi { display: block; width: calc(100% - 4px); max-width: 100%; text-align: left; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; padding: 4px 8px; margin: 2px 0; border: 1px dashed var(--accent); border-bottom-width: 2px; border-radius: 4px; resize: vertical; white-space: pre; tab-size: 4; box-sizing: border-box; }
.blank.ok { border-color: var(--ok); background: var(--ok-soft); }
.blank.equiv { border-bottom-style: dashed; }
.blank.multi.equiv { border-style: dashed; }
.blank.bad { border-color: var(--pen); background: var(--bad-soft); }
.blank.shown { border-color: var(--part); background: var(--part-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.hold { user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none; }
.btn.hold.active { background: var(--part-soft); border-color: var(--part); color: var(--part); }
.result { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.result.ok { color: var(--ok); }
.result.bad { color: var(--pen); }
textarea.code {
  width: 100%; min-height: 360px; resize: vertical; background: var(--code-bg); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; white-space: pre; overflow-x: auto;
}
textarea.out { min-height: 110px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.given { margin-bottom: 14px; }

.diff { margin-top: 18px; }
.diff .line { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); }
.diff .line .m { font-family: var(--font-body); font-weight: 700; text-align: center; color: var(--pen); }
.diff .line.ok .m { color: var(--ok); }
.diff .line.miss { background: var(--bad-soft); }
.diff .line.part { background: var(--part-soft); }
.diff .line.part .m { color: var(--part); }
.diff pre { padding: 10px 0; }
.extra { margin-top: 10px; }
.extra pre { background: var(--part-soft); }
.legend { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

.concepts { display: grid; gap: 10px; }
.cq { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.cq .n { font-family: var(--font-mono); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cq .t { min-width: 0; line-height: 2.1; }
.cq .t .blank { font-family: var(--font-body); font-size: 14px; }
.cq .peek { font-size: 12px; padding: 3px 8px; }
.cq .mk { font-weight: 700; color: var(--pen); font-size: 18px; width: 1.2em; text-align: center; }
.cq.ok .mk { color: var(--ok); }
.chhead { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; margin: 14px 0 2px; }
.chhead:first-child { margin-top: 0; }
.tip { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--code-bg); }
.vtag { font-size: 10.5px; font-weight: 700; color: var(--part); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.chip.var[aria-pressed="true"] { border-color: var(--part); background: var(--part-soft); color: var(--part); }
.chipsep { width: 1px; background: var(--rule); margin: 2px 4px; }

/* 이론 정리 */
.theory { display: grid; gap: 18px; }
.tsec { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 24px; min-width: 0; }
@media (max-width: 520px) { .tsec { padding: 16px; } }
.tsec > h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.01em; display: flex; gap: 10px; align-items: baseline; text-wrap: balance; }
.tsec h3 { font-size: 15px; margin: 18px 0 6px; padding-top: 12px; border-top: 1px dashed var(--rule); }
.tsec h3:first-of-type { border-top: 0; padding-top: 0; margin-top: 10px; }
.tsec ul { margin: 4px 0; padding-left: 1.2em; max-width: 72ch; }
.tsec li { margin: 2px 0; }
.tsec code, .pat code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; }
.tsec strong { color: var(--accent); }
.tbl { overflow-x: auto; margin: 8px 0; }
.tbl table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--rule); padding: 5px 10px; text-align: left; vertical-align: top; }
.tbl th { background: var(--code-bg); font-weight: 700; white-space: nowrap; }
.warn { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--pen); background: var(--bad-soft); border-radius: 0 6px 6px 0; font-size: 14px; }
.warn::before { content: "주의 "; font-weight: 700; color: var(--pen); }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-bottom: 4px; }
.toc a { color: var(--accent); text-decoration: none; }
.toc a:hover { text-decoration: underline; }

/* 코드 정리 */
.search { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.pats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; margin: 10px 0 16px; }
.pat { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--paper); min-width: 0; }
.pat h4 { margin: 0 0 2px; font-size: 14.5px; }
.pat p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.pat pre { margin: 0; }
details.ex { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
details.ex + details.ex { margin-top: 6px; }
details.ex summary { cursor: pointer; padding: 9px 14px; font-weight: 500; list-style-position: inside; }
details.ex summary:hover { color: var(--accent); }
details.ex .exbody { padding: 0 14px 14px; min-width: 0; }
.subhead { font-size: 12px; letter-spacing: 0.06em; font-weight: 700; color: var(--muted); margin: 18px 0 6px; }
.note { font-size: 13px; background: var(--part-soft); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .seg button { transition: background-color .15s, border-color .15s; } }
.sig { white-space: pre; }
/* VS Code 스타일 편집기: 테마와 상관없이 Dark+ 한 가지 모습 */
:root {
  --vs-bg: #1e1e1e; --vs-side: #252526; --vs-bar: #2d2d2d; --vs-tab: #1e1e1e; --vs-tab-off: #2d2d2d;
  --vs-fg: #d4d4d4; --vs-dim: #858585; --vs-line: #2a2d2e; --vs-sel: #264f78; --vs-blue: #007acc;
  --vs-term: #181818; --vs-border: #3c3c3c; --vs-ok: #89d185; --vs-err: #f48771; --vs-warn: #cca700;
  --vs-kw: #569cd6; --vs-ctl: #c586c0; --vs-str: #ce9178; --vs-num: #b5cea8; --vs-com: #6a9955;
  --vs-type: #4ec9b0; --vs-fn: #dcdcaa; --vs-var: #9cdcfe; --vs-pre: #c586c0;
}
.ide { border: 1px solid var(--vs-border); border-radius: 8px; overflow: hidden; background: var(--vs-bg); color: var(--vs-fg); min-width: 0; }
.ide-top { display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between; background: var(--vs-bar); border-bottom: 1px solid var(--vs-border); }
.ide-tabs { display: flex; min-width: 0; }
.ide-tab { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; background: var(--vs-tab); color: #ffffff; font-family: var(--font-mono); font-size: 12.5px; border-top: 2px solid var(--vs-blue); white-space: nowrap; }
.ide-tab .ic { color: #519aba; font-weight: 700; font-size: 11px; }
.ide-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.ide-tab.dirty .dot { background: #ffffff; opacity: .8; }
.ide-actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px; align-items: center; }
.vbtn { font: inherit; font-size: 12.5px; border: 1px solid transparent; background: transparent; color: var(--vs-fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.vbtn:hover { background: #3a3d41; }
.vbtn.run { background: #0e639c; color: #ffffff; font-weight: 700; }
.vbtn.run:hover { background: #1177bb; }
.vbtn.grade { background: #2ea043; color: #ffffff; font-weight: 700; }
.vbtn.grade:hover { background: #3fb950; }
.vbtn:disabled { opacity: .5; cursor: progress; }
.vbtn:focus-visible { outline: 1px solid var(--vs-blue); outline-offset: 1px; }
.ide-ed { position: relative; }
.ide-ed .CodeMirror { height: 400px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; }
.ide-ed.tall .CodeMirror { height: 480px; }
@media (max-width: 600px) { .ide-ed .CodeMirror, .ide-ed.tall .CodeMirror { height: 340px; font-size: 13px; } }
.ide-ed textarea.fallback { width: 100%; height: 400px; border: 0; background: var(--vs-bg); color: var(--vs-fg); padding: 10px 14px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; resize: vertical; white-space: pre; tab-size: 4; }
.ide-status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; background: var(--vs-blue); color: #ffffff; font-size: 11.5px; padding: 2px 10px; font-family: var(--font-body); }
.ide-status span { white-space: nowrap; }
.ide-panel { border-top: 1px solid var(--vs-border); background: var(--vs-term); }
.ide-ptabs { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 0 12px; border-bottom: 1px solid var(--vs-border); font-size: 11.5px; letter-spacing: .04em; }
.ide-ptabs button { background: none; border: 0; border-bottom: 1px solid transparent; color: var(--vs-dim); font: inherit; padding: 7px 0 6px; cursor: pointer; text-transform: uppercase; }
.ide-ptabs button[aria-selected="true"] { color: #e7e7e7; border-bottom-color: #e7e7e7; }
.ide-pbody { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); min-height: 150px; }
@media (max-width: 700px) { .ide-pbody { grid-template-columns: minmax(0, 1fr); } }
.ide-stdin { border-right: 1px solid var(--vs-border); display: flex; flex-direction: column; min-width: 0; }
@media (max-width: 700px) { .ide-stdin { border-right: 0; border-bottom: 1px solid var(--vs-border); } }
.ide-stdin label { font-size: 11px; color: var(--vs-dim); padding: 6px 10px 2px; letter-spacing: .04em; }
.ide-stdin textarea { flex: 1; min-height: 70px; resize: vertical; background: transparent; color: var(--vs-fg); border: 0; padding: 4px 10px 8px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.ide-stdin textarea:focus-visible { outline: 1px solid var(--vs-blue); outline-offset: -1px; }
.ide-out { min-width: 0; max-height: 320px; overflow: auto; }
.ide-term { margin: 0; padding: 8px 12px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; color: #cccccc; white-space: pre-wrap; word-break: break-word; }
.ide-term .cmd { color: var(--vs-dim); }
.ide-term .err { color: var(--vs-err); }
.ide-term .ok { color: var(--vs-ok); }
.ide-term .warn { color: var(--vs-warn); }
.ide-term .tnote { color: var(--vs-dim); }
@media (max-width: 700px) { .ide-status .keys { display: none; } }
.ttable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ttable th, .ttable td { border-bottom: 1px solid var(--vs-border); padding: 6px 10px; text-align: left; vertical-align: top; }
.ttable th { color: var(--vs-dim); font-weight: 500; font-size: 11px; letter-spacing: .04em; }
.ttable pre { margin: 0; font-family: var(--font-mono); white-space: pre-wrap; word-break: break-word; color: #cccccc; }
.ttable .pass { color: var(--vs-ok); font-weight: 700; }
.ttable .fail { color: var(--vs-err); font-weight: 700; }
.ttable td.mark { width: 3em; text-align: center; }
.ttable td:nth-child(2) { width: 16%; min-width: 7em; }
.lockbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--muted); margin: 6px 0 8px; }
.cm-s-vscode-dark.CodeMirror { background: var(--vs-bg); color: var(--vs-fg); }
.cm-s-vscode-dark .CodeMirror-gutters { background: var(--vs-bg); border-right: 0; }
.cm-s-vscode-dark .CodeMirror-linenumber { color: var(--vs-dim); padding: 0 12px 0 8px; }
.cm-s-vscode-dark .CodeMirror-activeline-background { background: var(--vs-line); }
.cm-s-vscode-dark .CodeMirror-activeline .CodeMirror-linenumber { color: #c6c6c6; }
.cm-s-vscode-dark .CodeMirror-cursor { border-left: 2px solid #aeafad; }
.cm-s-vscode-dark div.CodeMirror-selected, .cm-s-vscode-dark.CodeMirror-focused div.CodeMirror-selected { background: var(--vs-sel); }
.cm-s-vscode-dark .CodeMirror-line::selection, .cm-s-vscode-dark .CodeMirror-line > span::selection, .cm-s-vscode-dark .CodeMirror-line > span > span::selection { background: var(--vs-sel); }
.cm-s-vscode-dark span.cm-keyword { color: var(--vs-ctl); }
.cm-s-vscode-dark span.cm-type { color: var(--vs-kw); }
.cm-s-vscode-dark span.cm-builtin { color: var(--vs-type); }
.cm-s-vscode-dark span.cm-atom { color: var(--vs-kw); }
.cm-s-vscode-dark span.cm-number { color: var(--vs-num); }

<!-- ───────── 개념 빈칸 데이터: "장 | 문장"  {{정답§다른정답}} ───────── -->
<script type="text/plain" id="data-concepts">
1 | 폴야의 문제 해결 단계: 문제 이해 → {{알고리즘}}(문제 해결 방법) → {{프로그램}}(찾은 방법에 따라 실현) → 해결 방법의 신뢰성 검증
1 | C언어는 일련의 처리 과정을 정해진 순서에 따라 실행하는 {{절차적§절차지향}} 언어이고, Java·Python·C++은 {{객체지향}} 언어이다.
1 | {{컴파일러}}는 고수준 언어로 작성된 소스 프로그램을 한꺼번에 기계어로 번역한다.
1 | {{링커}}는 오브젝트 파일들을 라이브러리와 연결하여 실행 프로그램을 만든다.
1 | C언어의 창시자는 {{데니스 리치§데니스리치}}이다.
2 | 프로그램 개발 과정: 설계 → 소스 작성 → {{컴파일}} → {{링크}} → 실행 및 디버깅
2 | 설계 단계에서는 {{순서도}}와 {{의사 코드§의사코드}}를 도구로 사용한다.
2 | 소스 파일이 test.c이면 컴파일 후 {{test.obj}}, 링크 후 {{test.exe}}가 만들어진다.
2 | 컴파일 오류는 대부분 {{문법}} 오류이다.
2 | 0으로 나누거나 잘못된 메모리 주소에 접근하는 것은 {{실행 시간§런타임}} 오류이다.
2 | 문법은 맞지만 결과가 의도대로 나오지 않는 오류는 {{논리}} 오류이다.
2 | 소스에 존재하는 오류를 잡는 것을 {{디버깅}}이라고 한다. 유래: 1945년 마크 II의 나방, {{그레이스 호퍼}}
2 | 소프트웨어 유지 보수 비용은 전체 비용의 {{50}}% 이상을 차지한다.
2 | 통합 개발 환경(IDE) = 에디터 + {{컴파일러}} + {{디버거}}
2 | {{솔루션}}은 프로젝트가 들어 있는 컨테이너, {{프로젝트}}는 하나의 실행 파일을 만드는 데 필요한 항목들의 컨테이너이다.
2 | 디버거 단축키: F5 실행, {{F10}} Step Over, {{F11}} Step Into, {{F9}} 중단점
2 | 문장의 끝에는 반드시 {{;}}이 있어야 하고, 모든 C 프로그램에는 {{main}} 함수가 있어야 한다.
2 | 줄바꿈 문자는 {{\n}}이다.
2 | 에러는 심각한 오류, {{경고}}(warning)는 경미한 오류이다.
2 | C언어는 대문자와 소문자를 {{구별한다§구별함§구별}}.
3 | 여러 줄 주석은 {{/*}} … {{*/}}, 한 줄 주석은 {{//}} 로 쓴다. 주석은 중첩할 수 {{없다§없음}}.
3 | #include처럼 # 기호로 시작하는 것은 {{전처리기}}이다.
3 | printf()를 쓰려면 {{stdio.h}} 헤더 파일을 포함해야 한다.
3 | {{return}}은 함수를 종료시키면서 값을 반환하는 키워드이다.
3 | 함수의 시작과 끝은 {{{}}와 {{}}} 기호로 나타낸다.
3 | 변수는 프로그램이 사용하는 데이터를 일시적으로 저장하는 {{메모리}} 공간이다.
3 | 자료형에는 정수형, {{부동소수점§실수}}형, {{문자}}형이 있다.
3 | 식별자는 영문자, 숫자, {{밑줄§_}}로 이루어지며 {{숫자}}로 시작할 수 없다.
3 | C언어에서 고유한 의미를 가진 단어를 {{키워드}}(예약어)라고 한다.

@@ xor | 5 | Lab: XOR를 이용한 암호화
## explain
- 왜 key = 0xff 인가 :: char는 8비트라서 0xff(= 255 = 11111111)는 8비트가 모두 1인 키다. 이 키와 XOR하면 data의 모든 비트가 뒤집혀서 원래 글자를 알아볼 수 없게 된다. 키는 아무 값이나 되지만, 0xff는 '모든 비트를 뒤집는다'는 걸 보여 주기 좋은 값이다.
- 'a' ^ 0xff 계산 :: 'a' = 97 = 01100001, 0xff = 11111111 → XOR 결과 10011110 (= 158, char로는 -98). 아스키 범위 밖이라 화면에는 깨진 글자로 보인다.
- 복호화가 같은 식인 이유 :: XOR는 같은 값으로 두 번 하면 원래대로 돌아온다. (data ^ key) ^ key = data ^ (key ^ key) = data ^ 0 = data. 10011110 ^ 11111111 = 01100001 = 'a'.

    {{char key = 0xff;}}
    {{char encrpted_data;}}

    printf("암호화된 문자={{%c}} \n", encrpted_data);

    {{char orig_data;}}
    orig_data = {{encrpted_data ^ key}};
    printf("원래의 데이터={{%c}}\n", orig_data);
    {{return 0;}}
}

@@ chicken | 5 | 도전문제3: 양념 반 후라이드 반

현진 치킨은 양념 치킨 한 마리를 A원, 후라이드 치킨 한 마리를 B원, 반반 치킨 한 마리를 C원에 판다. 반반 치킨은 절반이 양념, 절반이 후라이드라서 반반 치킨 2마리를 사면 양념 1마리 + 후라이드 1마리를 산 것과 같다.
상도는 양념 치킨을 최소 X마리, 후라이드 치킨을 최소 Y마리 사려고 한다 (필요보다 더 많이 사도 된다). 이때 드는 최소 비용을 구하는 프로그램을 작성하라.
• 입력: 한 줄에 정수 다섯 개 A B C X Y (scanf 한 번으로 a, b, c, x, y에 입력)
• 출력: 최소 비용 (정수 하나)
• 풀이 순서 (변수: a, b, c, x, y, 짝 수 m, 합계 total = 0)
  ① 반반 2마리 가격(2 × c)이 양념 + 후라이드(a + b)보다 싸면, x와 y 중 작은 수(m)만큼은 반반으로 산다: total = m × 2 × c, 그리고 x와 y에서 각각 m을 뺀다.
  ② 남은 양념 x마리는 한 마리마다 a원과 반반 2마리(2 × c) 중 더 싼 값으로 산다. 남은 후라이드 y마리도 b와 2 × c 중 더 싼 값으로 산다. (조건 연산자 ? : 사용)
  ③ total을 출력한다.
• 예) 1500 2000 1600 3 2 → 2×1600 = 3200이 1500+2000 = 3500보다 싸므로 반반 4마리(6400원)로 양념 2 + 후라이드 2를 해결. 남은 양념 1마리는 1500 < 3200이라 1500원 → 합계 7900원.
(백준 16917번 문제. 슬라이드에 정답 코드가 없어 만든 풀이입니다)
## in
1500 2000 1600 3 2
## out
7900
## code
#include <stdio.h>

int main(void)
{
    {{int a, b, c, x, y;}}
    {{int m, total = 0;}}

    scanf("%d %d %d {{%d}} %d", &a, &b, &c, &x, &y);

    if ({{2 * c < a + b}}) {
        m = {{(x < y) ? x : y}};    // 둘 중 적은 수만큼 반반으로
        total = {{m * 2 * c}};
        x -= {{m}};
        y -= {{m}};
    }
    total += {{(a < 2 * c) ? a : 2 * c}} * x;
    total += {{(b < 2 * c) ? b * y : 2 * c * y}};

    printf("{{%d}}\n", total);
    {{return 0;}}
}

<script type="text/plain" id="data-theory">
@@ t1 | 1 | C언어 소개
### 왜 프로그래밍인가
- 4차 산업혁명(인공지능, 자율주행차, 로봇, 생명과학)의 필수 기술이다.
- C언어는 **데니스 리치**가 만들었다. 인공지능, 업무 자동화, 웹/앱, 게임, 데이터 분석의 기초가 된다.
### 문제 해결 단계 (조지 폴야)
- 문제 이해 → **알고리즘**(해결 방법) → **프로그램**(방법을 실현) → 신뢰성 검증
### 절차적 언어 vs 객체지향 언어
| 구분 | 특징 | 예 |
| 절차적 언어 | 일련의 처리 과정을 정해진 순서대로 실행 | C |
| 객체지향 언어 | 객체를 부품처럼 만들어 조립, 코드 재사용이 쉬움 | Java, Python, C++ |
### C 프로그램의 동작 과정
- **컴파일러**: 소스 프로그램을 한꺼번에 기계어로 번역한다.
- **링커**: 오브젝트 파일과 라이브러리를 연결해 실행 프로그램을 만든다.

@@ t2 | 2 | 프로그램 작성 과정
### 개발 과정 5단계
- 설계 → 소스 작성 → **컴파일** → **링크** → 실행 및 디버깅
- 설계: 순서도와 의사 코드로 알고리즘을 만든다. 알고리즘은 언어와 무관하다.
| 단계 | 결과 파일 | 설명 |
| 소스 작성 | test.c | 알고리즘을 언어 문법에 맞게 기술 |
| 컴파일 | test.obj | 소스 → 오브젝트 파일 |
| 링크 | test.exe | 오브젝트 + 라이브러리 → 실행 파일 |
### 오류의 종류
| 종류 | 예 |
| 컴파일 시간 오류 | 문법 오류 (세미콜론 누락, 따옴표 누락) |
| 실행 시간 오류 | 0으로 나누기, 잘못된 메모리 접근 |
| 논리 오류 | 문법은 맞지만 결과가 틀림 (\n 빠뜨림 등) |
- 에러(error)는 심각한 오류, 경고(warning)는 경미한 오류.
- 디버깅: 오류를 찾아 고치는 것. 1945년 마크 II에 날아든 나방 → 그레이스 호퍼가 "디버깅"이라 기록.
- 유지 보수 비용은 전체의 50% 이상. 버그가 남아 있거나 요구가 추가되기 때문.
### 통합 개발 환경 (IDE)
- IDE = 에디터 + 컴파일러 + 디버거 (비주얼 스튜디오, 이클립스, Dev-C++)
- 솔루션은 프로젝트들의 컨테이너, 프로젝트는 실행 파일 하나를 만드는 컨테이너.
| 키 | 기능 |
| F5 | 실행 (Go) |
| F9 | 중단점 설정 |
| F10 | Step Over (함수도 한 문장) |
| F11 | Step Into (함수 안으로) |
### 첫 프로그램 규칙
- `#include <stdio.h>` 헤더 포함, 모든 프로그램에는 `main` 함수가 있어야 한다.
- 문장 끝에는 반드시 `;`. 문장은 위에서 아래로 순차 실행된다.
- `\n` 은 줄바꿈 문자. C는 대소문자를 구별한다 (`Main` ≠ `main`).

@@ t3 | 3 | C프로그램 구성요소
### 주석
- `/* 여러 줄 */`, `// 줄 끝까지`. 주석은 중첩할 수 없고 실행에 영향이 없다.
- 좋은 주석은 코드를 반복하지 않고 **의도**를 설명한다.
### 전처리기와 함수
- `#` 으로 시작하는 줄은 전처리기. `#include <stdio.h>` 는 표준 입출력 헤더를 포함한다.
- 함수: 특정 기능을 하는 문장들을 중괄호 `{ }` 로 묶고 이름을 붙인 것. 프로그램 = 함수의 집합.
- `return 0;` 은 함수를 끝내며 0을 반환한다. main은 운영체제가 호출한다.
### 변수와 자료형
- 변수: 데이터를 일시적으로 저장하는 메모리 공간. 사용 전에 선언해야 한다.
- 자료형: 정수형(int), 부동소수점형(float, double), 문자형(char)
- `int x, y, sum;` 처럼 한 줄에 여러 개 선언 가능. `int x = 10;` 처럼 초기화 가능.
### 식별자 규칙
- 영문자, 숫자, 밑줄 `_` 만 사용. 숫자로 시작 불가. 공백 불가.
- 대소문자 구별 (index, Index, INDEX는 서로 다름). 키워드(예약어)는 사용 불가.
- 가능: `sum`, `_count`, `King3` / 불가: `2nd_base`, `money#`, `double`
### 입출력
| 형식 지정자 | 자료형 | printf | scanf |
| %d | int | O | O |
| %f | float | O | O |
| %lf | double | O (=%f) | O (반드시) |
| %c | char | O | O |
- `scanf("%d", &x);` — 값을 저장할 변수의 **주소**가 필요하므로 `&` 를 붙인다.
! Visual Studio에서 scanf 오류가 나면 맨 첫 줄에 `#define _CRT_SECURE_NO_WARNINGS` 를 쓴다.

@@ t4 | 4 | 변수와 자료형
### 변수와 상수
- 변수: 값 변경 가능 / 상수: 값 변경 불가 (100, 3.14, 'A', "Hello")
- 변수는 **메인 메모리**에 만들어진다.
### 자료형 크기 (Visual Studio 기준)
| 자료형 | 크기 | 범위/비고 |
| char | 1바이트 | -128 ~ 127 |
| short | 2바이트 | -32768 ~ 32767 |
| int | 4바이트 | 약 -21억 ~ +21억 |
| long | 4바이트 | int와 같음 (리눅스 gcc는 8) |
| long long | 8바이트 | 64비트 |
| float | 4바이트 | 부호1 + 지수8 + 가수23 비트 |
| double | 8바이트 | float보다 정밀 |
### 정수
- `unsigned` 는 음수가 아닌 값만. `unsigned distance;` = `unsigned int distance;`
- 오버플로우: 범위를 넘으면 반대쪽 끝으로 돌아간다. SHRT_MAX(32767)+1 → -32768, USHRT_MAX+1 → 0 (`limits.h`)
- `010` 은 8진수(8), `0x10` 은 16진수(16), `123L` 은 long 상수.
- 음수는 **2의 보수**로 표현한다 (모든 비트 반전 + 1). 덧셈 회로만으로 뺄셈 가능.
### 실수
- 고정 소수점(정수부/소수부 비트 고정) vs **부동 소수점**(범위가 대폭 늘어남, 약 10^-38 ~ 10^38)
- `%f` 는 소수점 6자리 (0.123457), `%e` 는 지수 형식 (1.234568e-01)
- 너무 크면 오버플로우(inf), 너무 작으면 언더플로우(0)
### 기호 상수
- `#define TAX_RATE 0.2` 또는 `const int MONTHS = 12;`
- 장점: 가독성이 높아지고 값을 한 곳에서 쉽게 변경할 수 있다.
### 문자형
- 문자는 **아스키 코드**로 저장한다. 'A' = 65, 'a' = 97, '0' = 48

- ② 출력이 함수 안이면 `void`, main에서 `printf("%f", f(x))` 처럼 쓰이면 값을 `return`.
- ③ 누적 변수 초기화: 합 `sum = 0.0`, 곱 `fact = 1`, 개수 `count = 0`
- ④ 반복문 작성 → ⑤ 반환/출력 → ⑥ main에 호출 넣기 → ⑦ 주석 3줄 이상
### 수열 문제 공식
- 부호 교대: `if (i % 2 == 1) sum += 항; else sum -= 항;`
- 실수 나눗셈: `1.0 / i` (정수 `1 / i` 는 0)
- 다음 항을 이전 항으로 만들기: `term *= (x - 1);`, `term = term * x / n;`
- 수렴 판정: `if (fabs(sum - prev) < EPSILON) break;` 다음 줄에 `prev = sum;`
- 최대 반복 제한: `for (i = 1; i <= MAX_ITER; i++)`
### 입력 검증 패턴
- 다시 입력받기: `do { scanf(...); } while (x < 0.5 || x > 2);`
- 범위 밖이면 종료: `if (N < 1 || N > 100) { printf("잘못된 입력입니다.\n"); return 0; }`
! scanf_s는 Visual Studio 전용이다. 시험 환경이 VS면 scanf_s 또는 `#define _CRT_SECURE_NO_WARNINGS` + scanf.
! 출력 형식(소수점 자리 `%.3f`, `%.6f`)과 문구를 예시와 똑같이 맞춘다.
</script>

- 항은 이전 항에 x / n 을 곱해서 만든다. (팩토리얼을 따로 구하지 않는다)

#define EPSILON 0.000001
## stub

## desc

    x = a;

{

    while (b != 0) {

@@ q_power | 8 | 거듭제곱 power() | 예상
## desc
실수 base와 정수 exp를 받아 base의 exp 제곱을 반환하는 함수 power()를 작성하시오. exp가 음수면 1 / base^(-exp) 를 반환한다. pow() 사용 금지.
## cond
- double power(double base, int exp)
- 반복문으로 곱한다.
## head
#include <stdio.h>
## stub
double power(double base, int exp)
{
    // 여기에 작성

}
## sol
double power(double base, int exp)
{
    double result = 1.0;
    int n = exp;

    if (n < 0)
        n = -n;
    for (int i = 0; i < n; i++)
        result *= base;
    if (exp < 0)
        return 1.0 / result;
    return result;
}
## main
int main(void)
{
    double base;
    int exp;
    printf("밑과 지수 입력: ");
    scanf("%lf %d", &base, &exp);
    printf("%.2f ^ %d = %.4f\n", base, exp, power(base, exp));
    return 0;
}

## desc

{
    // 여기에 작성

}

int collatz_steps(int n)
{
    int steps = 0;
    while (n != 1) {
        if (n % 2 == 0)
            n = n / 2;
        else

        steps++;
    }
    return steps;

int count_digit(int n, int d)

long power_r(int base, int n)

int fib(int n)
{
    if (n <= 1)
        return n;
    return fib(n - 1) + fib(n - 2);

  function holdReveal(label, inputs, cls, onShow, onHide) {

    const allInputs = [];
    const rows = [];
    let lastCh = 0;
    list.forEach((q, i) => {
      if (q.ch !== lastCh) { box.append(h("div", { class: "chhead", text: CH[q.ch] })); lastCh = q.ch; }
      const t = h("div", { class: "t" });
      const ins = [];
      splitBlanks(q.text).forEach(p => {
        if (p.t != null) t.append(p.t);
        else { const inp = blankInput(p.a, true, false); ins.push(inp); t.append(inp); }
      });
      const mk = h("span", { class: "mk", "aria-live": "polite" });
      const row = h("div", { class: "cq" }, h("span", { class: "n", text: String(i + 1).padStart(2, "0") }), t,
        h("div", { style: "display:flex;gap:6px;align-items:center" },
          holdReveal("정답", ins, "btn peek"), mk));
      row._ins = ins; row._mk = mk; row._q = q;
      rows.push(row); allInputs.push(...ins);

    });
    const res = h("span", { class: "result" });
    const grade = () => {
      let perfect = 0, okBl = 0;
      rows.forEach(r => {
        const ok = gradeInputs(r._ins); okBl += ok;
        const full = ok === r._ins.length;
        r.classList.toggle("ok", full); r._mk.textContent = full ? "○" : "✕";
        if (full) { perfect++; markDone(r._q.id, 100); }
      });
      res.textContent = "빈칸 " + okBl + " / " + allInputs.length + " · 문장 " + perfect + " / " + rows.length;
      res.className = "result " + (perfect === rows.length ? "ok" : "bad");
    };
    enterToNext(allInputs, grade);
    rows.forEach(r => keepInputs("cc:" + r._q.id, r._ins));
    const actions = () => h("div", { class: "actions" },
      h("button", { class: "btn primary", onclick: grade }, "전체 채점"),
      holdReveal("전체 정답 보기 (누르고 있기)", allInputs),
      twoStepButton("다시 풀기 (모두 지우기)", "btn", () => { liveSavers.clear(); rows.forEach(r => store.set("cc:" + r._q.id, null)); render(); }), res);
    main.append(h("div", { class: "sheet" },
      h("div", { class: "qhead" }, h("h2", { text: "개념 빈칸 채우기" }), h("span", { class: "tag", text: chap ? CH[chap] : "전체 " + list.length + "문항" })),
      h("p", { class: "tip" }, "띄어쓰기와 영문 대소문자는 무시하고 채점합니다. ", h("kbd", { text: "Enter" }), " 로 다음 빈칸으로 이동, 마지막 칸에서 Enter 하면 채점합니다."),
      box, actions()));
  }

  // ── 문제 목록(사이드바) 공통 ──
  function picker(main, items, key, prefix, body) {
    if (!items.length) { main.append(h("div", { class: "sheet", text: "이 장에는 해당 문제가 없습니다." })); return; }
    let idx = items.findIndex(p => p.id === cur[key]);
    if (idx < 0) idx = 0;
    const go = i => { cur[key] = items[(i + items.length) % items.length].id; store.set("cur", cur); render(); };
    const side = h("nav", { class: "side", "aria-label": "문제 목록" });
    let lastCh = 0;
    items.forEach((p, i) => {
      if (p.ch !== lastCh) { side.append(h("div", { class: "grp", text: CH[p.ch] })); lastCh = p.ch; }
      const sc = done[prefix + p.id];
      side.append(h("button", { "aria-current": String(i === idx), onclick: () => go(i) },
        h("span", {}, p.title, p.variant ? h("span", { class: "vtag", text: "변형" }) : null), h("span", { class: "mark" + (sc >= 100 ? " done" : ""), text: sc >= 100 ? "○" : sc ? sc + "%" : "" })));
    });
    const sel = h("select", { id: "pick-" + key, "aria-label": "문제 선택", onchange: e => go(+e.target.value) },
      items.map((p, i) => { const o = h("option", { value: String(i), text: p.ch + "장 · " + (p.variant ? "[변형] " : "") + p.title }); if (i === idx) o.selected = true; return o; }));
    const mob = h("div", { class: "mobile-pick" }, h("button", { class: "btn", onclick: () => go(idx - 1), "aria-label": "이전 문제" }, "‹"), sel, h("button", { class: "btn", onclick: () => go(idx + 1), "aria-label": "다음 문제" }, "›"));
    const sheet = h("div", { class: "sheet" });
    body(sheet, items[idx], () => go(idx + 1), () => go(Math.floor(Math.random() * items.length)));
    main.append(h("div", { class: "layout" }, side, h("div", { style: "min-width:0" }, mob, sheet)));
  }
  function header(sheet, p, label) {
    sheet.append(h("div", { class: "qhead" }, h("span", { class: "tag", text: p.ch + "장" }), h("h2", { text: p.title }), p.variant ? h("span", { class: "vtag", text: "변형 문제" }) : null));
    if (p.desc) sheet.append(h("p", { class: "desc", text: p.desc }));
    if (p.note) sheet.append(h("div", { class: "note", text: p.note }));
  }
  function ioBox(p) {
    const io = h("div", { class: "io" });
    if (p.in) io.append(h("div", {}, h("div", { class: "label", text: "입력 예시" }), h("pre", { class: "box", text: p.in })));
    if (p.out) io.append(h("div", {}, h("div", { class: "label", text: "실행 결과" }), h("pre", { class: "box term", text: p.out })));
    return io;
  }

  // ── 단계별 힌트: 1 풀이 방향, 2 핵심 조건·식, 3 코드 뼈대 ──
  function hintLevels(p) {
    const code = solve(p.code);
    const body = code.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "");
    const L1 = [];
    const scans = (body.match(/\bscanf(_s)?\s*\(/g) || []).length;
    const funcs = [];
    body.replace(/^\s*(?:static\s+)?(?:void|int|long|double|float|char)\s+(\w+)\s*\([^)]*\)\s*\{?\s*$/gm, (m, n) => { if (n !== "main" && !funcs.includes(n)) funcs.push(n); return m; });
    if (funcs.length) L1.push("main 말고 함수 " + funcs.map(f => f + "()").join(", ") + "를 만든다. main에서 호출해 결과를 쓴다.");
    if (scans) L1.push("scanf로 값을 " + (scans > 1 ? scans + "번 " : "") + "입력받는다. 변수 앞에 &를 붙인다.");
    const elif = (body.match(/\belse\s+if\b/g) || []).length;
    if (/\bswitch\s*\(/.test(body)) L1.push("switch 문으로 값에 따라 나눈다. case마다 break를 잊지 말고, 묶을 case는 break 없이 붙여 쓴다.");
    else if (elif) L1.push("if - else if(" + elif + "번) - else 로 조건을 위에서부터 차례로 검사한다. 먼저 걸린 조건 하나만 실행된다.");
    else if (/\belse\b/.test(body)) L1.push("if - else 로 참일 때와 거짓일 때를 나눈다.");
    else if (/\bif\s*\(/.test(body)) L1.push("if 문으로 조건이 참일 때만 실행한다.");
    if (/\bdo\s*\{?\s*$/m.test(body) || /\bdo\s*\{/.test(body)) L1.push("do-while 로 먼저 한 번 실행하고 조건을 나중에 검사한다. 끝에 세미콜론.");
    if (/\bwhile\s*\(/.test(body) && !/\}\s*while\s*\(/.test(body)) L1.push(/while\s*\(\s*1\s*\)/.test(body) ? "while (1) 무한 루프를 돌다가 조건이 맞으면 break 로 빠져나온다." : "while 문으로 조건이 참인 동안 반복한다. 반복 변수를 바꾸는 것을 잊지 않는다.");
    const fors = (body.match(/\bfor\s*\(/g) || []).length;
    if (fors > 1 && /for[^\n]*\n[^\n]*for|for[^{]*\{[^}]*for/.test(body)) L1.push("for 문을 겹쳐서(중첩) 바깥은 줄, 안쪽은 한 줄의 내용을 반복한다.");
    else if (fors) L1.push("for (초기식; 조건식; 증감식) 으로 정해진 횟수만큼 반복한다.");
    if (/\bstatic\b/.test(body)) L1.push("static 변수는 함수가 끝나도 값이 남는다. 처음 한 번만 초기화된다.");
    funcs.forEach(f => { const re = new RegExp("\\b" + f + "\\s*\\([^)]*\\)\\s*\\{[\\s\\S]*?\\b" + f + "\\s*\\("); if (re.test(body)) L1.push(f + "()는 자기 자신을 다시 부르는 재귀 함수다. 먼저 종료 조건을 쓴다."); });
    const ops = [];
    if (/[^%"]%\s*[\w(]/.test(body.replace(/"(?:[^"\\]|\\.)*"/g, '""'))) ops.push("% (나머지)");
    if (/&&/.test(body)) ops.push("&& (그리고)");
    if (/\|\|/.test(body)) ops.push("|| (또는)");
    if (/\?[^:\n]+:/.test(body.replace(/"(?:[^"\\]|\\.)*"/g, '""'))) ops.push("? : (조건 연산자)");
    if (/\(double\)|\b\d+\.\d+\s*\/|\/\s*\d+\.\d+/.test(body)) ops.push("실수 나눗셈 (정수끼리 나누면 소수점이 버려짐)");
    if (ops.length) L1.push("자주 쓰는 연산: " + ops.join(", "));
    if (!L1.length) L1.push("printf로 실행 결과와 똑같이 출력한다. 줄바꿈은 \\n.");
    // 2단계: 빈칸 중 조건·계산이 들어간 것
    const L2 = [];
    const seen = new Set();
    p.code.split("\n").forEach(line => {
      const re = /\{\{([\s\S]*?)\}\}(?!\})/g; let m;
      while ((m = re.exec(line))) {
        const ans = m[1].split("§")[0];
        if (!/[<>=!&|%*\/+\-?]|\(|'/.test(ans) || /^%[-\d.l]*[a-z]$/.test(ans) || /^&\w+$/.test(ans) || seen.has(ans)) continue;
        seen.add(ans);
        const ctx = solve(line.slice(0, m.index)).trim() + " ▢ " + solve(line.slice(m.index + m[0].length)).trim();
        L2.push({ ctx: ctx.replace(/\s+/g, " ").slice(0, 70), ans });
      }
    });
    // 3단계: 핵심 식을 가린 코드 뼈대
    const L3 = p.code.replace(/\{\{([\s\S]*?)\}\}(?!\})/g, (m0, a) => { const t = a.split("§")[0]; return /[<>=!&|%*\/+\-?(]/.test(t) && t.length > 1 && !/^%[-+ #0-9.]*(?:l|h|ll)?[a-zA-Z%]$/.test(t) && !/^&\w+$/.test(t) ? "____" : t; });
    return { L1, L2: L2.slice(0, 8), L3 };
  }
  function hintStepper(box, levels) {
    let step = 0;
    const btn = h("button", { class: "btn" });
    const area = h("div", { class: "hints" });
    const titles = ["힌트 1 · 풀이 방향", "힌트 2 · 핵심 조건과 계산식", "힌트 3 · 코드 뼈대 (핵심 식만 가림)"];
    const draw = () => {
      area.replaceChildren();
      if (step >= 1) area.append(h("div", { class: "hint" }, h("div", { class: "label", text: titles[0] }), h("ul", {}, levels.L1.map(t => h("li", {}, inline(t))))));
      if (step >= 2) area.append(h("div", { class: "hint" }, h("div", { class: "label", text: titles[1] }),
        levels.L2.length ? h("ul", {}, levels.L2.map(x => h("li", {}, h("code", { text: x.ctx }), "  →  ", h("code", { class: "ans", text: x.ans })))) : h("p", { text: "이 문제는 특별한 조건식 없이 순서대로 출력하면 됩니다." })));
      if (step >= 3) area.append(h("div", { class: "hint" }, h("div", { class: "label", text: titles[2] }), h("pre", { class: "box", text: levels.L3 })));
      btn.textContent = step < 3 ? "힌트 " + (step + 1) + " 열기 (" + step + "/3)" : "힌트 접기";
    };
    btn.addEventListener("click", () => { step = step < 3 ? step + 1 : 0; draw(); });
    draw();
    box.replaceChildren(area);
    return btn;
  }

  // 코드 빈칸 안에 2~3줄짜리 통째 빈칸을 둘 자리: 계산·조건이 가장 많은 연속된 줄
  function pickWindow(lines) {
    const ok = l => {
      const t = solve(l).trim();
      return t && !/^[{}]$/.test(t) && !/^#/.test(t) && !/^\/[\/*]/.test(t) && !/^\*/.test(t) && !/\bmain\s*\(/.test(t)
        && !/^(?:static\s+)?(?:void|int|long|double|float|char)\s+\w+\s*\([^)]*\)\s*[{;]?$/.test(t) && t !== "return 0;" && !/^(else|do)$/.test(t);
    };
    const score = l => (l.match(/\{\{/g) || []).length * 2 + (solve(l).replace(/"(?:[^"\\]|\\.)*"/g, "").match(/[=+\-*\/%<>!&|]/g) || []).length;
    for (const n of [3, 2]) {
      let best = null, bs = 0;
      for (let i = 0; i + n <= lines.length; i++) {
        const w = lines.slice(i, i + n);
        if (!w.every(ok)) continue;
        const sc = w.reduce((a, l) => a + score(l), 0);
        if (sc > bs) { bs = sc; best = [i, i + n - 1]; }
      }
      if (best && bs >= 4) return best;
    }
    return null;
  }

  // ── 모드: 코드 빈칸 ──
  function renderCode(main) {
    picker(main, progs.filter(inChap), "code", "code:", (sheet, p, next, rand) => {
      header(sheet, p);
      sheet.append(ioBox(p));
      if (p.given) sheet.append(h("div", { class: "given" }, h("div", { class: "label", text: "주어진 코드 (오류 있음)" }), h("pre", { class: "box", text: p.given })));
      const nb = namesOnlyBox(solve(p.code));
      if (nb) sheet.append(nb);
      const ob = outlineBox(solve(p.code), false);
      if (ob) sheet.append(ob);
      const pre = h("pre", { class: "code" });
      const ins = [];
      const segs = [];   // 실행해서 확인할 때 프로그램을 다시 조립하기 위한 조각들
      const addParts = text => splitBlanks(text).forEach(part => {
        if (part.t != null) { pre.append(part.t); segs.push({ t: part.t }); }
        else { const inp = blankInput(part.a, false, true); ins.push(inp); pre.append(inp); segs.push({ inp, ans: part.a[0] }); }
      });
      const lines = p.code.split("\n");
      const win = pickWindow(lines);
      if (!win) addParts(p.code);
      else {
        const [a, b] = win;
        addParts(lines.slice(0, a).join("\n"));
        const blockLines = lines.slice(a, b + 1).map(solve);
        const ind = Math.min(...blockLines.map(l => l.match(/^ */)[0].length));
        const block = blockLines.map(l => l.slice(ind)).join("\n");
        const ta = h("textarea", { class: "blank multi", rows: String(blockLines.length + 1), spellcheck: "false", autocomplete: "off", autocapitalize: "off", "aria-label": (b - a + 1) + "줄 빈칸",
          placeholder: "// 여기에 " + (b - a + 1) + "줄을 직접 작성하세요 (Tab 들여쓰기, Ctrl+Enter 다음 칸)" });
        ta.style.marginLeft = ind + "ch";
        ta.style.width = "calc(100% - " + ind + "ch)";
        ta._answers = [block];
        const key = t => units(t, false).map(u => u.key).join("\n");
        ta._check = v => key(v) === key(block);
        ins.push(ta); pre.append(ta);
        segs.push({ inp: ta, ans: block, multi: ind });
        addParts(lines.slice(b + 1).join("\n"));
      }
      const res = h("span", { class: "result" });
      // 빈칸 값을 바꿔 끼운 프로그램 (override에 없는 빈칸은 정답으로 채움)
      const programFor = override => segs.map(sg => {
        if (sg.t != null) return sg.t;
        const v = override.has(sg.inp) ? override.get(sg.inp) : sg.ans;
        if (sg.multi == null) return v;
        return "\n" + v.split("\n").map(l => " ".repeat(sg.multi) + l).join("\n") + "\n";
      }).join("");
      const runnable = !("norun" in p) && !/rand\s*\(|time\s*\(/.test(solve(p.code));
      let ansRun = null;
      const sameRun = async override => {
        if (!ansRun) ansRun = await runC(programFor(new Map()), p.in || "");
        if (ansRun.unavailable || ansRun.compile || ansRun.runtime || ansRun.timeout) return false;
        const r = await runC(programFor(override), p.in || "");
        if (r.unavailable || r.compile || r.runtime || r.timeout) return false;
        if (normOut(r.text) === normOut(ansRun.text)) return true;
        // 안내 문구만 살짝 다르게 쓴 경우: 숫자는 모두 같고 문구가 80% 이상 같으면 인정
        const c = looseCompare(ansRun.text, "", r.text);
        return c.numOk && c.sim >= 0.8;
      };
      const show = ok => {
        res.textContent = ok === ins.length ? "○ 모두 정답 (" + ok + "/" + ins.length + ")" : "✕ " + ok + " / " + ins.length;
        res.className = "result " + (ok === ins.length ? "ok" : "bad");
      };
      let grading = false;
      const grade = async () => {
        if (grading) return;
        ins.forEach(i => { i.classList.remove("equiv"); i.removeAttribute("title"); });
        let ok = gradeInputs(ins);
        show(ok);
        const wrong = ins.filter(i => i.classList.contains("bad") && i.value.trim());
        if (wrong.length && runnable) {
          grading = true;
          res.textContent = "실행해서 결과가 같은지 확인 중…"; res.className = "result";
          const accept = i => { i.classList.remove("bad"); i.classList.add("ok", "equiv"); i.title = "정답과 다르게 썼지만 실행 결과가 같아서 정답으로 처리했어요"; };
          for (const i of wrong) if (await sameRun(new Map([[i, i.value]]))) accept(i);
          const still = wrong.filter(i => i.classList.contains("bad"));
          if (still.length > 1 && await sameRun(new Map(still.map(i => [i, i.value])))) still.forEach(accept);
          ok = ins.filter(i => i.classList.contains("ok")).length;
          grading = false;
          show(ok);
          if (ins.some(i => i.classList.contains("equiv"))) res.textContent += " · 점선 칸은 풀이가 달라도 실행 결과가 같아 정답";
        }
        markDone("code:" + p.id, Math.round(ok / ins.length * 100));
      };
      enterToNext(ins, grade);
      const kept = keepInputs("cb:" + p.id, ins);
      const expl = explainBox(explainCode(solve(p.code), p.explain));
      expl.classList.add("float");
      expl.hidden = true;
      const codeWrap = h("div", { class: "codewrap" }, pre, expl);
      const hintArea = h("div");
      const hintBtn = hintStepper(hintArea, hintLevels(p));
      sheet.append(h("div", { class: "label", text: "빈칸 " + ins.length + "개 · 공백은 무시, 대소문자는 구분 · 변수 선언 칸은 int x, y; 처럼 한 줄 전체를 씁니다" }), codeWrap,
        h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: grade }, "채점"),
          holdReveal("정답 보기 (누르고 있기)", ins, "btn", () => { expl.hidden = false; codeWrap.classList.add("open"); }, () => { expl.hidden = true; codeWrap.classList.remove("open"); }),
          hintBtn,
          twoStepButton("빈칸 모두 지우기", "btn", () => { ins.forEach(i => { i.value = ""; i.classList.remove("ok", "bad", "shown"); }); kept.save(); res.textContent = ""; ins[0] && ins[0].focus(); }),
          h("button", { class: "btn", onclick: () => { mode = "blank"; cur.blank = p.id; store.set("cur", cur); store.set("mode", mode); render(); scrollTo(0, 0); } }, "직접 코딩으로 풀기 →"),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res), hintArea);
    });
  }

  // ── 백지 테스트 채점기 ──
  const FMT = /%[-+ #0-9.]*(?:hh|h|ll|l|L)?[diouxXcsfFeEgGp%]|\\./g;
  const IGNORE = /^#define_CRT_SECURE_NO_WARNINGS$/;
  function units(code, loose) {
    code = code.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
    const res = []; let cur = "", start = -1, line = 0, sline = 0, depth = 0, i = 0;
    const n = code.length;
    const push = end => {
      if (cur) {
        const key = cur.replace(/scanf_s\(/g, "scanf(").replace(/main\(\)/g, "main(void)");
        if (!IGNORE.test(key)) res.push({ key, start, end, line: sline });
      }
      cur = ""; start = -1;
    };
    while (i < n) {
      const c = code[i];

  // ── 직접 코딩 도우미: 사용할 이름 목록, 출력 비교, 두 번 눌러 지우기 ──
  function splitTop(t) {
    const out = []; let d = 0, cur = "";
    for (const c of t) { if (c === "(") d++; if (c === ")") d--; if (c === "," && d === 0) { out.push(cur); cur = ""; } else cur += c; }
    out.push(cur); return out;
  }
  function namesOf(code) {
    const vars = new Map(), funcs = [], defs = [], seen = new Set();
    const addVar = (type, name) => { type = type.replace(/\s+/g, " ").trim(); if (seen.has(type + name)) return; seen.add(type + name); if (!vars.has(type)) vars.set(type, []); vars.get(type).push(name); };
    const T = "((?:static\\s+|register\\s+|auto\\s+|const\\s+)*(?:unsigned\\s+|signed\\s+|long\\s+)*(?:int|double|float|char|long|short))";
    code.split("\n").forEach(raw => {
      const line = raw.replace(/\/\/.*$/, "");
      let m;
      if ((m = line.match(/^#define\s+(\w+)\s+(.+?)\s*$/)) && !/^_CRT/.test(m[1])) defs.push(m[1] + " " + m[2]);
      if ((m = line.match(new RegExp("^\\s*(void|" + T.slice(1, -1) + ")\\s+(\\w+)\\s*\\(([^)]*)\\)\\s*\\{?\\s*$"))) && m[2] !== "main") {
        const sig = line.trim().replace(/\s*\{$/, "");
        if (!funcs.some(f => f.includes(" " + m[2] + "("))) funcs.push(sig);
        (m[3] || "").split(",").forEach(pp => { const q = pp.trim().match(/^(.*\S)\s+(\w+)$/); if (q && q[1] !== "void") addVar(q[1] + " (매개변수)", q[2]); });
        return;
      }
      if ((m = line.match(new RegExp("^\\s*" + T + "\\s+([^;]+);")))) {
        if (/\)\s*$/.test(m[2]) && /^\w+\s*\(/.test(m[2].trim())) return;   // 함수 원형
        splitTop(m[2]).forEach(part => { const q = part.trim().match(/^\**\s*(\w+)/); if (q) addVar(m[1].replace(/^(const\s+)+/, ""), q[1]); });
      }
      const f = line.match(new RegExp("for\\s*\\(\\s*" + T + "\\s+(\\w+)"));
      if (f) addVar(f[1], f[2]);
    });
    return { vars, funcs, defs };
  }
  function namesBox(code) {
    const { vars, funcs, defs } = namesOf(code);
    if (!vars.size && !funcs.length && !defs.length) return null;
    const rows = [];
    if (funcs.length) rows.push(h("li", {}, h("b", { text: "함수 " }), h("code", { text: funcs.join("   ") })));
    vars.forEach((ns, t) => rows.push(h("li", {}, h("b", { text: t + " " }), h("code", { text: ns.join(", ") }))));
    if (defs.length) rows.push(h("li", {}, h("b", { text: "기호 상수 " }), h("code", { text: defs.join("   ") })));
    return h("div", { class: "names" }, h("div", { class: "label", text: "사용할 이름 (이 이름을 쓰면 정답 코드와 비교하기 쉬워요)" }), h("ul", {}, rows));
  }
  function similarity(a, b) {
    a = a.slice(0, 1500); b = b.slice(0, 1500);
    if (!a.length && !b.length) return 1;
    let prev = new Uint16Array(b.length + 1), curr = new Uint16Array(b.length + 1);
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) curr[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], curr[j - 1]);
      [prev, curr] = [curr, prev];
    }
    return 2 * prev[b.length] / (a.length + b.length);
  }
  // 예시 출력과 "얼추" 비교: 숫자는 순서대로 같아야 하고, 문구는 비슷하면 된다
  function looseCompare(expected, input, got) {
    const NUM = /-?\d+(?:\.\d+)?/g;
    const nums = t => (t.match(NUM) || []).map(Number);
    const all = nums(expected), ins = nums(input), gn = nums(got);
    const eq = (a, b) => Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(a));
    const same = (a, b) => a.length === b.length && a.every((v, i) => eq(v, b[i]));
    // 입력값이 예시 출력 어디에 찍혔는지 모르므로, 입력 숫자를 하나씩 빼 보는 경우를 모두 시도한다
    let tries = 0, best = null;
    const search = (arr, k, from) => {
      if (++tries > 20000) return false;
      if (k === ins.length) { if (!best) best = arr; return same(arr, gn); }
      let found = false;
      for (let i = from; i < arr.length; i++) if (eq(arr[i], ins[k])) { found = true; if (search(arr.slice(0, i).concat(arr.slice(i + 1)), k + 1, i)) return true; }
      return !found && search(arr, k + 1, from);

    const numOk = search(all, 0, 0);
    const en = numOk ? gn : (best || all);
    let es = expected.replace(/\s+/g, "").replace(NUM, "");
    input.split(/\s+/).filter(t => t && !/^-?\d/.test(t)).forEach(t => { es = es.replace(t, ""); });
    const sim = similarity(es, got.replace(/\s+/g, "").replace(NUM, ""));

  function twoStepButton(label, cls, action) {

  }

  // ── 정답 코드와 비교: 변수 이름·줄 순서는 무시하고 자료형, 빠진 줄, 틀린 줄을 본다 ──
  const TYPE_RE = /^\s*((?:static\s+|register\s+|auto\s+|const\s+)*(?:unsigned\s+|signed\s+|long\s+)*(?:int|double|float|char|long|short|unsigned))\s+([^;]+);/;
  function declVars(code) {
    const out = [];
    code.replace(/\/\*[\s\S]*?\*\//g, "").split("\n").forEach(raw => {
      const line = raw.replace(/\/\/.*$/, "");
      let m = line.match(TYPE_RE);
      if (m && !/^\s*\w+\s*\([^)]*\)\s*$/.test(m[2])) {
        const ty = m[1].replace(/\b(register|auto|const)\s+/g, "").replace(/\s+/g, " ").trim();
        splitTop(m[2]).forEach(part => { const q = part.trim().match(/^\**\s*([A-Za-z_]\w*)/); if (q) out.push({ name: q[1], type: ty }); });
      }
      const f = line.match(/for\s*\(\s*((?:unsigned\s+|long\s+)*(?:int|double|float|char|long|short))\s+([A-Za-z_]\w*)/);
      if (f) out.push({ name: f[2], type: f[1].replace(/\s+/g, " ") });

    const seen = new Set();
    return out.filter(v => !seen.has(v.name) && seen.add(v.name));
  }
  const famOf = t => /double|float/.test(t) ? "실수" : /char/.test(t) ? "문자" : "정수";
  function renameOutsideStrings(key, map) {
    if (!map.size) return key;
    return key.split(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/).map((part, i) => i % 2 ? part
      : part.replace(/[A-Za-z_]\w*/g, w => map.has(w) ? map.get(w) : w)).join("");
  }
  const isDeclKey = k => /;$/.test(k) && /^(?:static|register|auto|const)*(?:unsigned|signed|long)*(?:int|double|float|char|short|long|unsigned)(?=[A-Za-z_*])/.test(k) && !/^[a-z ]+\w+\([^)]*\);$/.test(k);
  function smartCompare(answer, user, loose) {
    const AV = declVars(answer), UV = declVars(user);
    // 내 변수 → 정답 변수 짝짓기: 같은 이름 먼저, 남은 것은 선언 순서대로
    const map = new Map(), usedA = new Set(), usedU = new Set();
    UV.forEach(u => { if (AV.some(a => a.name === u.name)) { map.set(u.name, u.name); usedA.add(u.name); usedU.add(u.name); } });
    const restA = AV.filter(a => !usedA.has(a.name)), restU = UV.filter(u => !usedU.has(u.name));
    restU.forEach((u, i) => { if (restA[i]) { map.set(u.name, restA[i].name); usedA.add(restA[i].name); } });
    const types = AV.map(a => {
      const u = UV.find(x => map.get(x.name) === a.name);
      return { a, u, ok: !!u && famOf(u.type) === famOf(a.type) && (u.type.includes("static") === a.type.includes("static")) };
    });
    const strip = arr => arr.filter(x => !isDeclKey(x.key) && !/^[{}]$/.test(x.key) && x.key !== "else");
    const A = strip(units(answer, loose)).map(x => Object.assign(x, { text: answer.slice(x.start, x.end) }));
    const U = strip(units(user, loose)).map(x => Object.assign(x, { text: user.slice(x.start, x.end), key: renameOutsideStrings(x.key, map) }));
    const pool = new Map();
    U.forEach((u, i) => { if (!pool.has(u.key)) pool.set(u.key, []); pool.get(u.key).push(i); });
    const usedUi = new Set(), missing = [];
    let okN = 0;
    A.forEach(a => { const l = pool.get(a.key); if (l && l.length) { usedUi.add(l.shift()); okN++; } else missing.push(a); });
    let extra = U.filter((u, i) => !usedUi.has(i));

  function holdButton(label, onShow, onHide, cls) {

  }

  // ── 모드: 직접 코딩 (백지 테스트) ──

        const c = smartCompare(answer, ta.value, loose.checked);
        const pct = c.total ? Math.round(c.okN / c.total * 100) : 0;
        res.textContent = c.perfect ? "○ 정답 코드와 같은 내용이에요" : "✕ 맞은 줄 " + c.okN + " / " + c.total + (c.typeBad.length ? " · 자료형 " + c.typeBad.length + "곳 다름" : "");
        res.className = "result " + (c.perfect ? "ok" : "bad");
        markDone("blank:" + p.id, c.perfect ? 100 : Math.min(pct, 99));
        const sec = (title, cls, body) => h("div", { class: "cmpsec " + cls }, h("div", { class: "label", text: title }), body);
        const codeLine = t => h("code", { text: t.replace(/\s*\n\s*/g, " ").trim() });
        const parts = [];
        // 자료형
        const tyRows = c.types.map(t => h("li", { class: t.ok ? "ok" : "bad" },
          h("span", { class: "mk", text: t.ok ? "○" : "✕" }),
          h("span", {}, "정답 ", codeLine(t.a.type + " " + t.a.name)),
          h("span", {}, " ↔ 내 코드 ", t.u ? codeLine(t.u.type + " " + t.u.name) : h("em", { text: "선언 없음" }))));
        if (c.types.length) parts.push(sec("변수 자료형 (" + (c.types.length - c.typeBad.length) + " / " + c.types.length + " 일치 — 정수·실수·문자 계열이 같으면 맞음)", c.typeBad.length ? "bad" : "ok", h("ul", { class: "tylist" }, tyRows)));
        if (c.wrong.length) parts.push(sec("틀린 줄 " + c.wrong.length + "곳 — 비슷한 줄이 있지만 내용이 달라요", "bad",
          h("ul", { class: "pairs" }, c.wrong.map(w => h("li", {}, h("div", {}, h("b", { text: "정답 " }), codeLine(w.a.text)), h("div", {}, h("b", { text: "내 코드 " }), codeLine(w.u.text)))))));
        if (c.missing.length) parts.push(sec("빠진 줄 " + c.missing.length + "곳 — 정답에는 있는데 내 코드에 없어요", "bad",
          h("ul", { class: "pairs" }, c.missing.map(m => h("li", {}, codeLine(m.text))))));
        if (c.extra.length) parts.push(sec("정답에 없는 줄 " + c.extra.length + "곳", "warn",
          h("ul", { class: "pairs" }, c.extra.map(m => h("li", {}, codeLine(m.text))))));
        if (c.perfect) parts.push(sec("○ 빠진 줄도 틀린 줄도 없어요", "ok", h("p", { class: "legend", text: "맞은 줄 " + c.okN + " / " + c.total }))); 
        out.replaceChildren(h("div", { class: "label", text: "정답 코드와 비교 결과" }), ...parts,
          h("div", { class: "legend", text: "변수 이름, 줄 순서, 공백·줄바꿈·중괄호 위치, 주석, scanf_s/scanf 차이는 보지 않아요. 같은 내용인지만 봅니다." }));
      };
      const hintArea = h("div");
      const hintBtn = hintStepper(hintArea, hintLevels(p));
      const ansPane = h("div", { class: "anspane", hidden: "" }, h("div", { class: "label", text: "정답 코드 (버튼에서 손을 떼면 사라져요)" }), h("pre", { class: "code", text: answer }), explainBox(explainCode(answer, p.explain)));
      const cmpWrap = h("div", { class: "cmpwrap" }, ide.el, ansPane);
      sheet.append(
        h("div", { class: "label", text: "처음부터 직접 코딩해 보세요 — ✓ 실행 채점은 출력의 숫자가 같고 문구가 비슷하면 통과입니다" }), cmpWrap,
        h("div", { class: "opts" },
          h("label", { for: "loose" }, loose, "정답 코드와 비교할 때 printf 안내 문구는 무시하고 %d, \\n 같은 형식만 보기")),
        h("div", { class: "actions" },
          h("button", { class: "btn", onclick: grade }, "정답 코드와 비교"),
          hintBtn,
          holdButton("정답 보기 (누르고 있기)", () => { cmpWrap.classList.add("open"); ansPane.hidden = false; ide.ed.cm && ide.ed.cm.refresh(); }, () => { cmpWrap.classList.remove("open"); ansPane.hidden = true; ide.ed.cm && ide.ed.cm.refresh(); }),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res),
        hintArea, hintBox, out);
    });
  }

  // ── 모드: 출력 예측 ──
  function renderOutput(main) {
    picker(main, outputs.filter(inChap), "output", "out:", (sheet, p, next, rand) => {
      sheet.append(h("div", { class: "qhead" }, h("span", { class: "tag", text: p.ch + "장" }), h("h2", { text: p.title }), p.variant ? h("span", { class: "vtag", text: "변형 문제" }) : null));
      sheet.append(h("p", { class: "desc", text: ("full" in p ? "전체 프로그램입니다." : "main 함수 안의 코드입니다.") + " 실행 결과를 그대로 적어 보세요. (공백 차이는 무시)" }));
      sheet.append(h("pre", { class: "code", text: p.code }));
      const ta = h("textarea", { class: "code out", id: "out-" + p.id, spellcheck: "false", "aria-label": "실행 결과 입력", style: "margin-top:12px" });
      keepInputs("ob:" + p.id, [ta]);
      const res = h("span", { class: "result" });
      const ans = h("div");
      const norm = s => s.replace(/\s+/g, "");
      const grade = () => {
        const ok = p.out.split("\n§\n").some(o => norm(ta.value) === norm(o));
        res.textContent = ok ? "○ 정답" : "✕ 다시 생각해 보세요";
        res.className = "result " + (ok ? "ok" : "bad");
        if (ok) markDone("out:" + p.id, 100);
      };
      sheet.append(h("div", { class: "label", style: "margin-top:14px", text: "실행 결과" }), ta,
        h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: grade }, "채점"),
          h("button", { class: "btn", onclick: () => ans.replaceChildren(h("div", { class: "label", style: "margin-top:12px", text: "정답" }), h("pre", { class: "box term", text: p.out.split("\n§\n")[0] })) }, "정답 보기"),
          h("button", { class: "btn", onclick: async () => {
            const src = "full" in p ? p.code : "#include <stdio.h>\n#include <math.h>\n\nint main(void)\n{\n" + p.code.split("\n").map(l => "    " + l).join("\n") + "\n    return 0;\n}\n";
            ans.replaceChildren(h("div", { class: "label", style: "margin-top:12px", text: "실제 실행 결과" }), h("pre", { class: "box term", text: "실행 중…" }));
            const r = await runC(src, "");
            ans.lastChild.textContent = r.unavailable ? "C 실행기를 불러오지 못했습니다. 인터넷에 연결된 웹 주소로 열어 주세요." : (r.text || "") + (r.compile ? "\n[컴파일 오류] " + r.compile : "") + (r.runtime ? "\n[" + r.runtime + "]" : "") + (r.timeout ? "\n[시간 초과]" : "");
          } }, "▶ 실행해 보기"),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res), ans);
    });
  }

  // ── 인라인 서식: `코드`, **강조** ──
  function inline(text) {
    const frag = document.createDocumentFragment();
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(part => {
      if (!part) return;
      if (part.startsWith("`") && part.endsWith("`") && part.length > 1) frag.append(h("code", { text: part.slice(1, -1) }));
      else if (part.startsWith("**") && part.endsWith("**")) frag.append(h("strong", { text: part.slice(2, -2) }));
      else frag.append(part);
    });
    return frag;
  }
  function renderMd(body) {
    const out = [];
    const lines = body.split("\n");
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (!l.trim()) continue;
      if (l.startsWith("### ")) out.push(h("h3", {}, inline(l.slice(4))));
      else if (l.startsWith("! ")) out.push(h("div", { class: "warn" }, inline(l.slice(2))));
      else if (l.startsWith("- ")) {
        const ul = h("ul");
        while (i < lines.length && lines[i].startsWith("- ")) { ul.append(h("li", {}, inline(lines[i].slice(2)))); i++; }
        i--; out.push(ul);
      } else if (l.startsWith("|")) {
        const rows = [];
        while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i].replace(/^\|\s*|\s*\|\s*$/g, "").split(/\s+\|\s+/)); i++; }
        i--;
        const table = h("table", {}, h("thead", {}, h("tr", {}, rows[0].map(c => h("th", {}, inline(c))))),
          h("tbody", {}, rows.slice(1).map(r => h("tr", {}, r.map(c => h("td", {}, inline(c)))))));
        out.push(h("div", { class: "tbl" }, table));
      } else out.push(h("p", {}, inline(l)));
    }
    return out;
  }

  // ── 모드: 이론 정리 ──
  function renderTheory(main) {
    const list = theory.filter(t => !chap || t.ch === chap);
    const wrap = h("div", { class: "theory" });
    if (!chap) wrap.append(h("nav", { class: "toc", "aria-label": "장 목차" }, list.map(t => h("a", { href: "#" + t.id }, CH[t.ch]))));
    list.forEach(t => {
      wrap.append(h("section", { class: "tsec", id: t.id },
        h("h2", {}, h("span", { class: "tag", text: t.ch + "장" }), t.title), renderMd(t.body)));
    });
    main.append(wrap);
  }

  // ── 모드: 코드 정리 ──
  function renderCodes(main) {
    const q = h("input", { id: "code-search", type: "search", placeholder: "코드 검색 (예: switch, scanf, %lf, while)", "aria-label": "코드 검색" });
    q.value = store.get("codeq", "");
    const body = h("div");
    const draw = () => {
      store.set("codeq", q.value);
      const kw = q.value.trim().toLowerCase();
      const hit = p => !kw || (p.title + "\n" + (p.desc || "") + "\n" + solve(p.code || "")).toLowerCase().includes(kw);
      const chs = (chap ? [chap] : [1, 2, 3, 4, 5, 6, 7, 8, 9]);
      const blocks = [];
      chs.forEach(c => {
        const pats = patterns.filter(p => p.ch === c && hit(p));
        const exs = progs.filter(p => p.ch === c && hit(p));
        if (!pats.length && !exs.length) return;
        const sec = h("section", { class: "tsec" }, h("h2", {}, h("span", { class: "tag", text: c + "장" }), CH[c].replace(/^\d장 /, "")));
        if (pats.length) {
          sec.append(h("div", { class: "subhead", text: "핵심 문법 패턴" }),
            h("div", { class: "pats" }, pats.map(p => h("div", { class: "pat" }, h("h4", { text: p.title }), p.desc ? h("p", { text: p.desc }) : null, h("pre", { class: "box", text: p.code })))));
        }
        if (exs.length) {
          sec.append(h("div", { class: "subhead", text: "예제 코드 " + exs.length + "개 (눌러서 펼치기)" }));
          exs.forEach(p => {
            const d = h("details", { class: "ex" }, h("summary", {}, p.title, p.variant ? h("span", { class: "vtag", text: "변형" }) : null));
            d.addEventListener("toggle", () => {
              if (d.open && !d._filled) {
                d._filled = true;
                const b = h("div", { class: "exbody" });
                if (p.desc) b.append(h("p", { class: "desc", text: p.desc }));
                if (p.note) b.append(h("div", { class: "note", text: p.note }));
                b.append(ioBox(p), h("pre", { class: "code", text: solve(p.code) }),
                  h("div", { class: "actions" },
                    h("button", { class: "btn", onclick: () => { mode = "code"; cur.code = p.id; store.set("cur", cur); store.set("mode", mode); render(); scrollTo(0, 0); } }, "코드 빈칸으로 풀기"),
                    h("button", { class: "btn", onclick: () => { mode = "blank"; cur.blank = p.id; store.set("cur", cur); store.set("mode", mode); render(); scrollTo(0, 0); } }, "직접 코딩으로 풀기")));
                d.append(b);
              }
            });
            if (kw) d.open = true;
            sec.append(d);
          });
        }
        blocks.push(sec);
      });
      body.replaceChildren(...(blocks.length ? blocks : [h("div", { class: "sheet", text: "검색 결과가 없습니다." })]));
    };
    q.addEventListener("input", draw);
    main.append(h("div", { class: "search" }, q), h("div", { class: "theory" }, body));
    draw();
  }

  function render() {
    flushAll();
    liveSavers.clear();
    renderControls();
    const main = $("#main");
    main.replaceChildren();
    ({ theory: renderTheory, codes: renderCodes, quiz: renderQuiz, concept: renderConcept, code: renderCode, blank: renderBlank, output: renderOutput })[mode](main);
  }
  renderStats();
  render();
})();
</script>
</body>
