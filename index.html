<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C 백지 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 시험 답안지 — 상단 모드/장 선택, 왼쪽 문제 목록, 오른쪽 답안 작성 영역. 채점은 빨간펜 ○ / ✕ 표시 */
:root {
  --bg: #f3f5f8;
  --paper: #ffffff;
  --ink: #18212d;
  --muted: #5b6676;
  --rule: #d6dce5;
  --accent: #2747c9;
  --accent-soft: #e4e9fb;
  --pen: #d23b2c;
  --ok: #19804a;
  --ok-soft: #e2f3e8;
  --bad-soft: #fbe6e3;
  --part-soft: #fdf1d8;
  --part: #a8670a;
  --code-bg: #f7f8fb;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "D2Coding", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161e; --paper: #19202b; --ink: #e5e9f0; --muted: #98a3b3; --rule: #2d3747;
    --accent: #8ea4ff; --accent-soft: #232d4a; --pen: #ff7b6b; --ok: #5fd08f; --ok-soft: #173326;
    --bad-soft: #3a1f1c; --part-soft: #3a2e15; --part: #f0b450; --code-bg: #141a23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161e; --paper: #19202b; --ink: #e5e9f0; --muted: #98a3b3; --rule: #2d3747;
  --accent: #8ea4ff; --accent-soft: #232d4a; --pen: #ff7b6b; --ok: #5fd08f; --ok-soft: #173326;
  --bad-soft: #3a1f1c; --part-soft: #3a2e15; --part: #f0b450; --code-bg: #141a23;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6; padding-inline: 16px; padding-block: 0 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
header.top {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 12px; padding-block: 28px 18px; border-bottom: 2px solid var(--ink);
}
.brand h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; text-wrap: balance; }
.brand h1 .mono { font-family: var(--font-mono); color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-size: 17px; display: block; line-height: 1.2; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 14px; }
.seg { display: inline-grid; grid-template-columns: repeat(4, auto); gap: 1px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--rule); }
@media (max-width: 520px) { .seg { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } }
.seg button { border: 0; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .mobile-pick { display: flex !important; } }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow: auto; border: 1px solid var(--rule); background: var(--paper); border-radius: 10px; }
.side .grp { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); padding: 10px 12px 4px; font-weight: 700; }
.side button { display: flex; width: 100%; gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13.5px; padding: 6px 12px; cursor: pointer; }
.side button:hover { background: var(--accent-soft); }
.side button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.side .mark { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side .mark.done { color: var(--ok); }
.mobile-pick { display: none; gap: 8px; margin-bottom: 12px; }
.mobile-pick select { flex: 1; min-width: 0; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 22px; min-width: 0; }
@media (max-width: 520px) { .sheet { padding: 16px; } }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 6px; }
.qhead h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.tag { font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; }
.desc { color: var(--muted); margin: 4px 0 14px; white-space: pre-wrap; }
.io { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
.io > div { min-width: 0; }
.label { font-size: 11px; letter-spacing: 0.08em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
pre, textarea.code { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; tab-size: 4; }
pre.box { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
pre.term { background: var(--ink); color: var(--paper); border-color: var(--ink); }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.blank {
  font: inherit; font-size: 13px; border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft);
  color: var(--ink); padding: 0 3px; border-radius: 3px 3px 0 0; min-width: 3ch; text-align: center;
}
.blank.ok { border-color: var(--ok); background: var(--ok-soft); }
.blank.bad { border-color: var(--pen); background: var(--bad-soft); }
.blank.shown { border-color: var(--part); background: var(--part-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.result { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.result.ok { color: var(--ok); }
.result.bad { color: var(--pen); }
textarea.code {
  width: 100%; min-height: 360px; resize: vertical; background: var(--code-bg); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; white-space: pre; overflow-x: auto;
}
textarea.out { min-height: 110px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.given { margin-bottom: 14px; }

.diff { margin-top: 18px; }
.diff .line { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); }
.diff .line .m { font-family: var(--font-body); font-weight: 700; text-align: center; color: var(--pen); }
.diff .line.ok .m { color: var(--ok); }
.diff .line.miss { background: var(--bad-soft); }
.diff .line.part { background: var(--part-soft); }
.diff .line.part .m { color: var(--part); }
.diff pre { padding: 10px 0; }
.extra { margin-top: 10px; }
.extra pre { background: var(--part-soft); }
.legend { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

.concepts { display: grid; gap: 10px; }
.cq { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.cq .n { font-family: var(--font-mono); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cq .t { min-width: 0; line-height: 2.1; }
.cq .t .blank { font-family: var(--font-body); font-size: 14px; }
.cq .peek { font-size: 12px; padding: 3px 8px; }
.cq .mk { font-weight: 700; color: var(--pen); font-size: 18px; width: 1.2em; text-align: center; }
.cq.ok .mk { color: var(--ok); }
.chhead { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; margin: 14px 0 2px; }
.chhead:first-child { margin-top: 0; }
.tip { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
kbd { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--code-bg); }
.note { font-size: 13px; background: var(--part-soft); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn, .chip, .seg button { transition: background-color .15s, border-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>C 백지 연습장 <span class="mono">_</span></h1>
      <p>프로그래밍 및 실습2 · 1~5장 (C언어 소개 → 수식과 연산자)</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="seg" id="modes" role="group" aria-label="공부 방식">
      <button data-mode="concept">개념 빈칸</button>
      <button data-mode="code">코드 빈칸</button>
      <button data-mode="blank">코드 백지 테스트</button>
      <button data-mode="output">출력 예측</button>
    </div>
    <div class="chips" id="chapters" role="group" aria-label="장 선택"></div>
  </div>

  <main id="main"></main>
</div>

<!-- ───────── 개념 빈칸 데이터: "장 | 문장"  {{정답§다른정답}} ───────── -->
<script type="text/plain" id="data-concepts">
1 | 폴야의 문제 해결 단계: 문제 이해 → {{알고리즘}}(문제 해결 방법) → {{프로그램}}(찾은 방법에 따라 실현) → 해결 방법의 신뢰성 검증
1 | C언어는 일련의 처리 과정을 정해진 순서에 따라 실행하는 {{절차적§절차지향}} 언어이고, Java·Python·C++은 {{객체지향}} 언어이다.
1 | {{컴파일러}}는 고수준 언어로 작성된 소스 프로그램을 한꺼번에 기계어로 번역한다.
1 | {{링커}}는 오브젝트 파일들을 라이브러리와 연결하여 실행 프로그램을 만든다.
1 | C언어의 창시자는 {{데니스 리치§데니스리치}}이다.
2 | 프로그램 개발 과정: 설계 → 소스 작성 → {{컴파일}} → {{링크}} → 실행 및 디버깅
2 | 설계 단계에서는 {{순서도}}와 {{의사 코드§의사코드}}를 도구로 사용한다.
2 | 소스 파일이 test.c이면 컴파일 후 {{test.obj}}, 링크 후 {{test.exe}}가 만들어진다.
2 | 컴파일 오류는 대부분 {{문법}} 오류이다.
2 | 0으로 나누거나 잘못된 메모리 주소에 접근하는 것은 {{실행 시간§런타임}} 오류이다.
2 | 문법은 맞지만 결과가 의도대로 나오지 않는 오류는 {{논리}} 오류이다.
2 | 소스에 존재하는 오류를 잡는 것을 {{디버깅}}이라고 한다. 유래: 1945년 마크 II의 나방, {{그레이스 호퍼}}
2 | 소프트웨어 유지 보수 비용은 전체 비용의 {{50}}% 이상을 차지한다.
2 | 통합 개발 환경(IDE) = 에디터 + {{컴파일러}} + {{디버거}}
2 | {{솔루션}}은 프로젝트가 들어 있는 컨테이너, {{프로젝트}}는 하나의 실행 파일을 만드는 데 필요한 항목들의 컨테이너이다.
2 | 디버거 단축키: F5 실행, {{F10}} Step Over, {{F11}} Step Into, {{F9}} 중단점
2 | 문장의 끝에는 반드시 {{;}}이 있어야 하고, 모든 C 프로그램에는 {{main}} 함수가 있어야 한다.
2 | 줄바꿈 문자는 {{\n}}이다.
2 | 에러는 심각한 오류, {{경고}}(warning)는 경미한 오류이다.
2 | C언어는 대문자와 소문자를 {{구별한다§구별함§구별}}.
3 | 여러 줄 주석은 {{/*}} … {{*/}}, 한 줄 주석은 {{//}} 로 쓴다. 주석은 중첩할 수 {{없다§없음}}.
3 | #include처럼 # 기호로 시작하는 것은 {{전처리기}}이다.
3 | printf()를 쓰려면 {{stdio.h}} 헤더 파일을 포함해야 한다.
3 | {{return}}은 함수를 종료시키면서 값을 반환하는 키워드이다.
3 | 함수의 시작과 끝은 {{{}}와 {{}}} 기호로 나타낸다.
3 | 변수는 프로그램이 사용하는 데이터를 일시적으로 저장하는 {{메모리}} 공간이다.
3 | 자료형에는 정수형, {{부동소수점§실수}}형, {{문자}}형이 있다.
3 | 식별자는 영문자, 숫자, {{밑줄§_}}로 이루어지며 {{숫자}}로 시작할 수 없다.
3 | C언어에서 고유한 의미를 가진 단어를 {{키워드}}(예약어)라고 한다.
3 | 변수에 값을 저장하는 연산을 {{대입}} 연산(배정·할당 연산)이라고 한다.
3 | scanf()는 값을 저장할 변수의 {{주소}}가 필요하므로 변수 앞에 {{&}}를 붙인다.
3 | scanf()로 float형을 입력받을 때는 {{%f}}, double형은 {{%lf}}를 사용한다.
3 | Visual Studio에서 scanf() 오류가 나면 소스 맨 처음에 #define {{_CRT_SECURE_NO_WARNINGS}}를 쓴다.
3 | double형 변수 f 선언: {{double f;}}
3 | int형 x와 y를 한 줄에 선언하고 1과 0으로 초기화: {{int x = 1, y = 0;}}
4 | {{변수}}는 저장된 값의 변경이 가능한 공간, {{상수}}는 변경이 불가능한 공간이다.
4 | 변수는 컴퓨터의 {{메인 메모리§메모리§주기억장치}}에 만들어진다.
4 | sizeof 결과: char {{1}}, short {{2}}, int {{4}}, long 4, float {{4}}, double {{8}} 바이트
4 | 음수가 아닌 값만 나타내는 수식자는 {{unsigned}}이다.
4 | SHRT_MAX는 {{32767}}이고 여기에 1을 더하면 {{-32768}}이 된다. USHRT_MAX(65535)+1은 {{0}}이다.
4 | SHRT_MAX 같은 상수는 {{limits.h}} 헤더에 정의되어 있다.
4 | 변수가 나타낼 수 있는 범위를 넘는 숫자를 저장하려 할 때 {{오버플로우}}가 발생한다.
4 | int y = 010; 의 값은 십진수로 {{8}}, int z = 0x10; 은 {{16}}이다.
4 | 123L 처럼 숫자 뒤에 L을 붙이면 {{long}}형 상수가 된다.
4 | 기호 상수 만들기: {{#define}} TAX_RATE 0.2  또는  {{const}} int MONTHS = 12;
4 | 기호 상수의 장점: {{가독성}}이 높아지고 값을 쉽게 변경할 수 있다.
4 | 컴퓨터는 음수를 {{2의 보수}}로 표현한다. 01000011의 2의 보수는 {{10111101}}이다.
4 | float(32비트) 부동소수점: 부호 1비트, 지수 {{8}}비트, 가수 {{23}}비트
4 | printf("%e", 0.123456789); 는 지수 형식, %f는 소수점 아래 {{6}}자리까지 출력한다.
4 | float x = 1e39; 를 출력하면 {{inf}}가 나온다 (부동소수점 {{오버플로우}}).
4 | 아주 작은 수를 저장해 0이 되는 현상은 {{언더플로우}}이다.
4 | 문자는 {{아스키§ASCII}} 코드로 표현하며 'A'의 코드 값은 {{65}}이다.
4 | 경고음 {{\a}}, 백스페이스 {{\b}}, 큰따옴표 {{\"}}, 역슬래시 {{\\}}
4 | 변수는 사용하기 전에 반드시 {{초기화}}해야 한다.
5 | 수식은 상수, 변수, 연산자의 조합이며 {{연산자}}와 {{피연산자}}로 나누어진다.
5 | C에는 거듭제곱 연산자가 {{없다§없음}}. x * x처럼 곱한다.
5 | 정수끼리 나눗셈 7 / 4의 결과는 {{1}}, 나머지 7 % 4는 {{3}}이다.
5 | x % 2가 {{0}}이면 짝수이다.
5 | printf에서 % 문자 자체를 출력하려면 {{%%}}를 쓴다.
5 | ++x는 먼저 {{증가}}하고 증가된 값을 사용, x++는 현재 값을 먼저 사용하고 {{나중에}} 증가한다.
5 | 100 = x + y; 는 왼쪽이 {{변수§lvalue}}가 아니므로 컴파일 오류이다.
5 | x *= y + 1 은 x = x * ({{y + 1§y+1}}) 과 같다.
5 | 관계 연산의 결과는 참이면 {{1}}, 거짓이면 {{0}}이다.
5 | 2 < x < 5 를 올바르게 쓰면 (2 < x) {{&&}} (x < 5) 이다.
5 | !3 의 값은 {{0}}, !0 의 값은 {{1}}이다. (3 >= 2) + 5 의 값은 {{6}}이다.
5 | 피연산자의 참/거짓은 {{0}}이 아니면 참, 0이면 거짓으로 판단한다.

(function () {
  "use strict";
  const CH = { 1: "1장 C언어 소개", 2: "2장 프로그램 작성 과정", 3: "3장 C프로그램 구성요소", 4: "4장 변수와 자료형", 5: "5장 수식과 연산자" };
  const MODES = {
    concept: "개념 빈칸", code: "코드 빈칸", blank: "코드 백지 테스트", output: "출력 예측"
  };

  // ── storage (실패해도 동작) ──
  const store = {
    get(k, d) { try { const v = localStorage.getItem("c-wb:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("c-wb:" + k, JSON.stringify(v)); } catch (e) {} }
  };

  // ── 데이터 파싱 ──
  const raw = id => document.getElementById(id).textContent.replace(/^\n/, "");
  function parseBlocks(text) {
    return text.split(/^@@ /m).filter(s => s.trim()).map(block => {
      const nl = block.indexOf("\n");
      const [id, ch, title] = block.slice(0, nl).split("|").map(s => s.trim());
      const obj = { id, ch: +ch, title };
      const parts = block.slice(nl + 1).split(/^## (\w+)\n/m);
      for (let i = 1; i < parts.length; i += 2) obj[parts[i]] = parts[i + 1].replace(/\s+$/, "");
      return obj;
    });
  }
  const BL = /\{\{([\s\S]*?)\}\}(?!\})/g;
  function splitBlanks(s) {
    const out = []; let last = 0, m;
    BL.lastIndex = 0;
    while ((m = BL.exec(s))) {
      if (m.index > last) out.push({ t: s.slice(last, m.index) });
      out.push({ a: m[1].split("§") });
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push({ t: s.slice(last) });
    return out;
  }
  const solve = s => s.replace(BL, (_, a) => a.split("§")[0]);

  const concepts = raw("data-concepts").split("\n").filter(l => l.trim()).map((l, i) => {
    const p = l.indexOf("|");
    return { id: "c" + i, ch: +l.slice(0, p).trim(), text: l.slice(p + 1).trim() };
  });
  const progs = parseBlocks(raw("data-progs"));
  const outputs = parseBlocks(raw("data-outputs"));

  // ── 상태 ──
  let mode = store.get("mode", "concept");
  if (!MODES[mode]) mode = "concept";
  let chap = store.get("chap", 0);
  let cur = store.get("cur", {});
  const done = store.get("done", {});   // id -> 점수(0~100)
  const markDone = (id, score) => { done[id] = Math.max(done[id] || 0, score); store.set("done", done); renderStats(); };

  const $ = (sel, el = document) => el.querySelector(sel);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    kids.flat().forEach(c => c != null && el.append(c));
    return el;
  };

  const normBlank = (s, ci) => {
    s = s.replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/\s+/g, "");
    return ci ? s.toLowerCase() : s;
  };

  // ── 헤더 통계 ──
  function renderStats() {
    const all = [...concepts, ...progs.map(p => ({ id: "code:" + p.id })), ...progs.map(p => ({ id: "blank:" + p.id })), ...outputs.map(o => ({ id: "out:" + o.id }))];
    const n = all.filter(x => (done[x.id] || 0) >= 100).length;
    const blanks = progs.filter(p => (done["blank:" + p.id] || 0) >= 100).length;
    $("#stats").replaceChildren(
      h("div", {}, h("b", { text: n + " / " + all.length }), "완벽히 맞힌 문제"),
      h("div", {}, h("b", { text: blanks + " / " + progs.length }), "백지 통과 코드")
    );
  }

  // ── 상단 컨트롤 ──
  function renderControls() {
    document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    const chips = $("#chapters");
    chips.replaceChildren(...[0, 1, 2, 3, 4, 5].map(c =>
      h("button", { class: "chip", "aria-pressed": String(chap === c), onclick: () => { chap = c; store.set("chap", c); render(); } }, c ? c + "장" : "전체")));
  }
  document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; store.set("mode", mode); render(); }));

  const inChap = x => !chap || x.ch === chap;

  // ── 빈칸 input 생성 ──
  function blankInput(answers, ci, mono) {
    const len = Math.max(...answers.map(a => [...a].length));
    const inp = h("input", { class: "blank", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "빈칸" });
    inp.style.width = "calc(" + Math.max(3, len + 1) + "ch + 8px)";
    if (!mono) inp.style.width = "calc(" + Math.max(4, len * 1.6 + 2) + "ch)";
    inp._answers = answers; inp._ci = ci;
    return inp;
  }
  function gradeInputs(inputs) {
    let ok = 0;
    inputs.forEach(inp => {
      const good = inp._answers.some(a => normBlank(a, inp._ci) === normBlank(inp.value, inp._ci));
      inp.classList.toggle("ok", good); inp.classList.toggle("bad", !good); inp.classList.remove("shown");
      if (good) ok++;
    });
    return ok;
  }
  function revealInputs(inputs) {
    inputs.forEach(inp => { if (!inp.classList.contains("ok")) { inp.value = inp._answers[0]; inp.classList.remove("bad"); inp.classList.add("shown"); } });
  }
  function enterToNext(inputs, onLast) {
    inputs.forEach((inp, i) => inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (inputs[i + 1]) inputs[i + 1].focus(); else onLast(); }
    }));
  }

  // ── 모드: 개념 빈칸 ──
  function renderConcept(main) {
    const list = concepts.filter(inChap);
    const box = h("div", { class: "concepts" });
    const allInputs = [];
    const rows = [];
    let lastCh = 0;
    list.forEach((q, i) => {
      if (q.ch !== lastCh) { box.append(h("div", { class: "chhead", text: CH[q.ch] })); lastCh = q.ch; }
      const t = h("div", { class: "t" });
      const ins = [];
      splitBlanks(q.text).forEach(p => {
        if (p.t != null) t.append(p.t);
        else { const inp = blankInput(p.a, true, false); ins.push(inp); t.append(inp); }
      });
      const mk = h("span", { class: "mk", "aria-live": "polite" });
      const row = h("div", { class: "cq" }, h("span", { class: "n", text: String(i + 1).padStart(2, "0") }), t,
        h("div", { style: "display:flex;gap:6px;align-items:center" },
          h("button", { class: "btn peek", onclick: () => { revealInputs(ins); } }, "정답"), mk));
      row._ins = ins; row._mk = mk; row._q = q;
      rows.push(row); allInputs.push(...ins);
      box.append(row);
    });
    const res = h("span", { class: "result" });
    const grade = () => {
      let perfect = 0, okBl = 0;
      rows.forEach(r => {
        const ok = gradeInputs(r._ins); okBl += ok;
        const full = ok === r._ins.length;
        r.classList.toggle("ok", full); r._mk.textContent = full ? "○" : "✕";
        if (full) { perfect++; markDone(r._q.id, 100); }
      });
      res.textContent = "빈칸 " + okBl + " / " + allInputs.length + " · 문장 " + perfect + " / " + rows.length;
      res.className = "result " + (perfect === rows.length ? "ok" : "bad");
    };
    enterToNext(allInputs, grade);
    const actions = () => h("div", { class: "actions" },
      h("button", { class: "btn primary", onclick: grade }, "전체 채점"),
      h("button", { class: "btn", onclick: () => revealInputs(allInputs) }, "전체 정답 보기"),
      h("button", { class: "btn", onclick: () => render() }, "다시 풀기"), res);
    main.append(h("div", { class: "sheet" },
      h("div", { class: "qhead" }, h("h2", { text: "개념 빈칸 채우기" }), h("span", { class: "tag", text: chap ? CH[chap] : "전체 " + list.length + "문항" })),
      h("p", { class: "tip" }, "띄어쓰기와 영문 대소문자는 무시하고 채점합니다. ", h("kbd", { text: "Enter" }), " 로 다음 빈칸으로 이동, 마지막 칸에서 Enter 하면 채점합니다."),
      box, actions()));
  }

  // ── 문제 목록(사이드바) 공통 ──
  function picker(main, items, key, prefix, body) {
    if (!items.length) { main.append(h("div", { class: "sheet", text: "이 장에는 해당 문제가 없습니다." })); return; }
    let idx = items.findIndex(p => p.id === cur[key]);
    if (idx < 0) idx = 0;
    const go = i => { cur[key] = items[(i + items.length) % items.length].id; store.set("cur", cur); render(); };
    const side = h("nav", { class: "side", "aria-label": "문제 목록" });
    let lastCh = 0;
    items.forEach((p, i) => {
      if (p.ch !== lastCh) { side.append(h("div", { class: "grp", text: CH[p.ch] })); lastCh = p.ch; }
      const sc = done[prefix + p.id];
      side.append(h("button", { "aria-current": String(i === idx), onclick: () => go(i) },
        h("span", { text: p.title }), h("span", { class: "mark" + (sc >= 100 ? " done" : ""), text: sc >= 100 ? "○" : sc ? sc + "%" : "" })));
    });
    const sel = h("select", { id: "pick-" + key, "aria-label": "문제 선택", onchange: e => go(+e.target.value) },
      items.map((p, i) => { const o = h("option", { value: String(i), text: p.ch + "장 · " + p.title }); if (i === idx) o.selected = true; return o; }));
    const mob = h("div", { class: "mobile-pick" }, h("button", { class: "btn", onclick: () => go(idx - 1), "aria-label": "이전 문제" }, "‹"), sel, h("button", { class: "btn", onclick: () => go(idx + 1), "aria-label": "다음 문제" }, "›"));
    const sheet = h("div", { class: "sheet" });
    body(sheet, items[idx], () => go(idx + 1), () => go(Math.floor(Math.random() * items.length)));
    main.append(h("div", { class: "layout" }, side, h("div", { style: "min-width:0" }, mob, sheet)));
  }
  function header(sheet, p, label) {
    sheet.append(h("div", { class: "qhead" }, h("span", { class: "tag", text: p.ch + "장" }), h("h2", { text: p.title })));
    if (p.desc) sheet.append(h("p", { class: "desc", text: p.desc }));
    if (p.note) sheet.append(h("div", { class: "note", text: p.note }));
  }
  function ioBox(p) {
    const io = h("div", { class: "io" });
    if (p.in) io.append(h("div", {}, h("div", { class: "label", text: "입력 예시" }), h("pre", { class: "box", text: p.in })));
    if (p.out) io.append(h("div", {}, h("div", { class: "label", text: "실행 결과" }), h("pre", { class: "box term", text: p.out })));
    return io;
  }

  // ── 모드: 코드 빈칸 ──
  function renderCode(main) {
    picker(main, progs.filter(inChap), "code", "code:", (sheet, p, next, rand) => {
      header(sheet, p);
      sheet.append(ioBox(p));
      if (p.given) sheet.append(h("div", { class: "given" }, h("div", { class: "label", text: "주어진 코드 (오류 있음)" }), h("pre", { class: "box", text: p.given })));
      const pre = h("pre", { class: "code" });
      const ins = [];
      splitBlanks(p.code).forEach(part => {
        if (part.t != null) pre.append(part.t);
        else { const inp = blankInput(part.a, false, true); ins.push(inp); pre.append(inp); }
      });
      const res = h("span", { class: "result" });
      const grade = () => {
        const ok = gradeInputs(ins);
        res.textContent = ok === ins.length ? "○ 모두 정답 (" + ok + "/" + ins.length + ")" : "✕ " + ok + " / " + ins.length;
        res.className = "result " + (ok === ins.length ? "ok" : "bad");
        markDone("code:" + p.id, Math.round(ok / ins.length * 100));
      };
      enterToNext(ins, grade);
      sheet.append(h("div", { class: "label", text: "빈칸 " + ins.length + "개 · 공백은 무시, 대소문자는 구분" }), pre,
        h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: grade }, "채점"),
          h("button", { class: "btn", onclick: () => revealInputs(ins) }, "정답 보기"),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res));
    });
  }

  // ── 백지 테스트 채점기 ──
  const FMT = /%[-+ #0-9.]*(?:hh|h|ll|l|L)?[diouxXcsfFeEgGp%]|\\./g;
  const IGNORE = /^#define_CRT_SECURE_NO_WARNINGS$/;
  function units(code, loose) {
    code = code.replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
    const res = []; let cur = "", start = -1, line = 0, sline = 0, depth = 0, i = 0;
    const n = code.length;
    const push = end => {
      if (cur) {
        const key = cur.replace(/scanf_s\(/g, "scanf(").replace(/main\(\)/g, "main(void)");
        if (!IGNORE.test(key)) res.push({ key, start, end, line: sline });
      }
      cur = ""; start = -1;
    };
    while (i < n) {
      const c = code[i];
      if (c === "\n") { if (cur.startsWith("#")) push(i); line++; i++; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === "/" && code[i + 1] === "/") { while (i < n && code[i] !== "\n") i++; continue; }
      if (c === "/" && code[i + 1] === "*") {
        i += 2;
        while (i < n && !(code[i] === "*" && code[i + 1] === "/")) { if (code[i] === "\n") line++; i++; }
        i += 2; continue;
      }
      if (start < 0) { start = i; sline = line; }
      if (c === '"' || c === "'") {
        let j = i + 1, body = "";
        while (j < n && code[j] !== c && code[j] !== "\n") {
          if (code[j] === "\\") { body += code[j] + (code[j + 1] || ""); j += 2; continue; }
          body += code[j]; j++;
        }
        let b = body.replace(/\s+/g, "");
        if (loose && c === '"') b = (body.match(FMT) || []).join("");
        cur += c + b + c; i = j + 1; continue;
      }
      cur += c;
      if (c === "(") depth++;
      else if (c === ")") depth = Math.max(0, depth - 1);
      else if ((c === ";" && depth === 0) || c === "{" || c === "}") push(i + 1);
      i++;
    }
    push(n);
    return res;
  }
  function lcs(a, b) {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i].key === b[j].key ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ma = new Array(n).fill(false), mb = new Array(m).fill(false);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i].key === b[j].key) { ma[i] = mb[j] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    return { ma, mb };
  }

  // ── 모드: 백지 테스트 ──
  function renderBlank(main) {
    picker(main, progs.filter(inChap), "blank", "blank:", (sheet, p, next, rand) => {
      header(sheet, p);
      sheet.append(ioBox(p));
      if (p.given) sheet.append(h("div", { class: "given" }, h("div", { class: "label", text: "주어진 코드 (오류 있음)" }), h("pre", { class: "box", text: p.given })));
      const answer = solve(p.code);
      const draftKey = "draft:" + p.id;
      const ta = h("textarea", { class: "code", id: "ta-" + p.id, spellcheck: "false", autocomplete: "off", autocapitalize: "off", placeholder: "#include <stdio.h>\n\nint main(void)\n{\n    ...\n}", "aria-label": "코드 작성" });
      ta.value = store.get(draftKey, "");
      ta.addEventListener("input", () => store.set(draftKey, ta.value));
      ta.addEventListener("keydown", e => {
        const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
        if (e.key === "Tab") {
          e.preventDefault();
          ta.setRangeText("    ", s, en, "end");
          store.set(draftKey, ta.value);
        } else if (e.key === "Enter" && !e.isComposing) {
          const ls = v.lastIndexOf("\n", s - 1) + 1;
          let ind = (v.slice(ls, s).match(/^[ \t]*/) || [""])[0];
          if (/\{\s*$/.test(v.slice(ls, s))) ind += "    ";
          e.preventDefault();
          ta.setRangeText("\n" + ind, s, en, "end");
          store.set(draftKey, ta.value);
        }
      });
      const loose = h("input", { type: "checkbox", id: "loose" });
      loose.checked = store.get("loose", false);
      loose.addEventListener("change", () => store.set("loose", loose.checked));
      const hintBox = h("div");
      const out = h("div", { class: "diff", "aria-live": "polite" });
      const res = h("span", { class: "result" });

      const grade = () => {
        const A = units(answer, loose.checked), U = units(ta.value, loose.checked);
        const { ma, mb } = lcs(A, U);
        const okN = ma.filter(Boolean).length;
        const pct = A.length ? Math.round(okN / A.length * 100) : 0;
        const perfect = okN === A.length && mb.every(Boolean);
        res.textContent = (perfect ? "○ 통과 " : "✕ ") + okN + " / " + A.length + " 구문 (" + pct + "%)";
        res.className = "result " + (perfect ? "ok" : "bad");
        markDone("blank:" + p.id, perfect ? 100 : Math.min(pct, 99));
        // 정답 줄별 상태
        const byLine = {};
        A.forEach((u, k) => (byLine[u.line] = byLine[u.line] || []).push(ma[k]));
        const pre = h("pre", { class: "code" });
        answer.split("\n").forEach((ln, li) => {
          const st = byLine[li];
          let cls = "", m = "";
          if (st) {
            const c = st.filter(Boolean).length;
            if (c === st.length) { cls = "ok"; m = "○"; } else if (c === 0) { cls = "miss"; m = "✕"; } else { cls = "part"; m = "△"; }
          }
          pre.append(h("div", { class: "line " + cls }, h("span", { class: "m", text: m }), h("span", { text: ln || " " })));
        });
        const extras = U.filter((u, k) => !mb[k]);
        out.replaceChildren(
          h("div", { class: "label", text: "채점 결과 (정답 코드 기준)" }), pre,
          h("div", { class: "legend", text: "○ 맞음 · △ 일부 틀림 · ✕ 빠졌거나 틀림 — 공백·줄바꿈·주석, _CRT_SECURE_NO_WARNINGS, scanf_s/scanf, main()/main(void) 차이는 무시합니다." }),
          extras.length ? h("div", { class: "extra" }, h("div", { class: "label", text: "정답에 없는 내 코드 (" + extras.length + "곳)" }),
            h("pre", { class: "box", text: extras.map(u => ta.value.slice(u.start, u.end).replace(/\s*\n\s*/g, " ")).join("\n") })) : null
        );
      };
      const hint = () => {
        const lines = answer.split("\n").map(l => {
          if (!l.trim() || /^\s*(\/\/|\/\*)/.test(l)) return l.trim() ? l.replace(/\S.*/, "// …") : "";
          const m = l.match(/^(\s*)([^\s(;]+)/);
          return m ? m[1] + m[2] + " …" : l;
        });
        hintBox.replaceChildren(h("div", { class: "label", text: "힌트: 각 줄의 첫 단어" }), h("pre", { class: "box", text: lines.join("\n") }));
      };
      sheet.append(
        h("div", { class: "label", text: "백지에 전체 코드를 써 보세요" }), ta,
        h("div", { class: "opts" },
          h("label", { for: "loose" }, loose, "printf 안내 문구는 무시하고 %d, \\n 같은 형식만 채점"),
          h("span", {}, h("kbd", { text: "Tab" }), " 들여쓰기 · 자동 들여쓰기 지원")),
        h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: grade }, "채점"),
          h("button", { class: "btn", onclick: hint }, "힌트"),
          h("button", { class: "btn", onclick: () => { hintBox.replaceChildren(h("div", { class: "label", text: "정답 코드" }), h("pre", { class: "box", text: answer })); } }, "정답 보기"),
          h("button", { class: "btn", onclick: () => { ta.value = ""; store.set(draftKey, ""); out.replaceChildren(); hintBox.replaceChildren(); res.textContent = ""; ta.focus(); } }, "지우기"),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res),
        hintBox, out);
    });
  }

  // ── 모드: 출력 예측 ──
  function renderOutput(main) {
    picker(main, outputs.filter(inChap), "output", "out:", (sheet, p, next, rand) => {
      sheet.append(h("div", { class: "qhead" }, h("span", { class: "tag", text: p.ch + "장" }), h("h2", { text: p.title })));
      sheet.append(h("p", { class: "desc", text: "main 함수 안의 코드입니다. 실행 결과를 그대로 적어 보세요. (공백 차이는 무시)" }));
      sheet.append(h("pre", { class: "code", text: p.code }));
      const ta = h("textarea", { class: "code out", id: "out-" + p.id, spellcheck: "false", "aria-label": "실행 결과 입력", style: "margin-top:12px" });
      const res = h("span", { class: "result" });
      const ans = h("div");
      const norm = s => s.replace(/\s+/g, "");
      const grade = () => {
        const ok = p.out.split("\n§\n").some(o => norm(ta.value) === norm(o));
        res.textContent = ok ? "○ 정답" : "✕ 다시 생각해 보세요";
        res.className = "result " + (ok ? "ok" : "bad");
        if (ok) markDone("out:" + p.id, 100);
      };
      sheet.append(h("div", { class: "label", style: "margin-top:14px", text: "실행 결과" }), ta,
        h("div", { class: "actions" },
          h("button", { class: "btn primary", onclick: grade }, "채점"),
          h("button", { class: "btn", onclick: () => ans.replaceChildren(h("div", { class: "label", style: "margin-top:12px", text: "정답" }), h("pre", { class: "box term", text: p.out.split("\n§\n")[0] })) }, "정답 보기"),
          h("button", { class: "btn", onclick: next }, "다음 문제"),
          h("button", { class: "btn", onclick: rand }, "랜덤"), res), ans);
    });
  }

  function render() {
    renderControls();
    const main = $("#main");
    main.replaceChildren();
    ({ concept: renderConcept, code: renderCode, blank: renderBlank, output: renderOutput })[mode](main);
  }
  renderStats();
  render();
})();
</script>
</body>
</html>
